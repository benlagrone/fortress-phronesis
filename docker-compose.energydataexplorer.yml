services:
  energydataexplorer-frontend:
    image: ${ENERGYDATAEXPLORER_FRONTEND_IMAGE:-ghcr.io/benlagrone/energydataexplorer-frontend:latest}
    container_name: energydataexplorer-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:13083:80"

  energydataexplorer-api:
    image: ${ENERGYDATAEXPLORER_API_IMAGE:-ghcr.io/benlagrone/energydataexplorer-api:latest}
    container_name: energydataexplorer-api
    restart: unless-stopped
    environment:
      APP_NAME: ${EDE_APP_NAME:-Energy Data Explorer}
      APP_ENV: ${EDE_APP_ENV:-production}
      APP_DEBUG: ${EDE_APP_DEBUG:-false}
      APP_URL: ${EDE_APP_URL:-https://api.energydataexplorer.com}
      APP_KEY: ${EDE_APP_KEY:-}
      LOG_CHANNEL: ${EDE_LOG_CHANNEL:-stack}
      LOG_LEVEL: ${EDE_LOG_LEVEL:-info}
      DB_CONNECTION: ${EDE_DB_CONNECTION:-mysql}
      DB_HOST: ${EDE_DB_HOST:-}
      DB_PORT: ${EDE_DB_PORT:-3306}
      DB_DATABASE: ${EDE_DB_DATABASE:-}
      DB_USERNAME: ${EDE_DB_USERNAME:-}
      DB_PASSWORD: ${EDE_DB_PASSWORD:-}
      DB_SOCKET: ${EDE_DB_SOCKET:-}
      MYSQL_ATTR_SSL_CA: ${EDE_MYSQL_ATTR_SSL_CA:-}
      CORS_ALLOWED_ORIGINS: ${EDE_CORS_ALLOWED_ORIGINS:-https://energydataexplorer.com,https://www.energydataexplorer.com}
      KEYCLOAK_AUTH_ENFORCED: ${EDE_KEYCLOAK_AUTH_ENFORCED:-true}
      KEYCLOAK_ISSUER: ${EDE_KEYCLOAK_ISSUER:-https://auth.pericopeai.com/realms/energydataexplorer}
      KEYCLOAK_JWKS_URL: ${EDE_KEYCLOAK_JWKS_URL:-https://auth.pericopeai.com/realms/energydataexplorer/protocol/openid-connect/certs}
      KEYCLOAK_AUDIENCES: ${EDE_KEYCLOAK_AUDIENCES:-energydataexplorer-web,account}
      KEYCLOAK_JWKS_CACHE_SECONDS: ${EDE_KEYCLOAK_JWKS_CACHE_SECONDS:-900}
      KEYCLOAK_ALLOWED_CLOCK_SKEW: ${EDE_KEYCLOAK_ALLOWED_CLOCK_SKEW:-60}
      SESSION_DRIVER: ${EDE_SESSION_DRIVER:-database}
      SESSION_LIFETIME: ${EDE_SESSION_LIFETIME:-120}
      CACHE_STORE: ${EDE_CACHE_STORE:-database}
      QUEUE_CONNECTION: ${EDE_QUEUE_CONNECTION:-database}
    ports:
      - "127.0.0.1:18038:80"
