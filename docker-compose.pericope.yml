    networks:
      - pericope_net

  pericopeai-api:
    build:
      context: ../AugustineService   # backend repo path
      dockerfile: Dockerfile
    env_file:
      - ../AugustineService/.env
    environment:
      - CORPUS_API_URL=${CORPUS_API_URL:-http://augustine-corpus-live:8001}
      - MYSQL_HOST=${MYSQL_HOST:-mysql}
      - MYSQL_USER=${MYSQL_USER:-augustine}
      - MYSQL_PASS=${MYSQL_PASS:-password}
      - MYSQL_DB=${MYSQL_DB:-augustine_chat}
    ports:
      - "18000:8080"                                            # host:container (uvicorn listens on 8080)
    depends_on:
      - mysql
    networks:
      - pericope_net
    restart: unless-stopped

  solomonic-clock:
    build:
      context: ../Solomonic_Seals
      dockerfile: Dockerfile
    image: ${SOLOMONIC_CLOCK_IMAGE:-solomonic-clock:latest}
    environment:
      - PORT=8080
      - SOLOMONIC_APP_VERSION=${SOLOMONIC_APP_VERSION:-dev}
      - SOLOMONIC_RELEASE=${SOLOMONIC_RELEASE:-local}
      - SOLOMONIC_RELEASED_AT=${SOLOMONIC_RELEASED_AT:-}
      - SOLOMONIC_PSALM_SOURCE_MODE=${SOLOMONIC_PSALM_SOURCE_MODE:-pericope_first}
      - SOLOMONIC_PERICOPE_API_BASE=${SOLOMONIC_PERICOPE_API_BASE:-http://augustine-corpus-live:8001}
      - SOLOMONIC_GUIDED_PROMPTS_API_KEY=${SOLOMONIC_GUIDED_PROMPTS_API_KEY:-}
      - SOLOMONIC_VIBEVOICE_API_BASE=${SOLOMONIC_VIBEVOICE_API_BASE:-http://192.168.0.126:8011}
      - SOLOMONIC_VIBEVOICE_FALLBACK_API_BASE=${SOLOMONIC_VIBEVOICE_FALLBACK_API_BASE:-http://192.168.0.126:8013}
      - SOLOMONIC_VIBEVOICE_API_TOKEN=${SOLOMONIC_VIBEVOICE_API_TOKEN:-}
      - SOLOMONIC_VIBEVOICE_PROJECT_ID=${SOLOMONIC_VIBEVOICE_PROJECT_ID:-solomonic-seals}
      - SOLOMONIC_VIBEVOICE_SPEAKER=${SOLOMONIC_VIBEVOICE_SPEAKER:-Carter}
    ports:
      - "8086:8080"
    depends_on:
      - augustine-corpus-live
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/api/clock', timeout=5).read()\""]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - pericope_net
    restart: unless-stopped

  pericopeai-assets:
    build:
      context: ../pericopeai-assets
      dockerfile: Dockerfile
    image: ${PERICOPEAI_ASSETS_IMAGE:-pericopeai-assets:latest}
    ports:
      - "13085:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - pericope_net
    restart: unless-stopped


  pericopeai-frontend:
    build:
      context: ../AugustineFE        # frontend repo path
      dockerfile: Dockerfile
      args:
        REACT_APP_API_BASE_URL: ${REACT_APP_API_BASE_URL:-/api}
        REACT_APP_ENVIRONMENT: ${REACT_APP_ENVIRONMENT:-dev}
        REACT_APP_AUGUSTINE_API_KEY: ${REACT_APP_AUGUSTINE_API_KEY:-}
        REACT_APP_GA_MEASUREMENT_ID: ${REACT_APP_GA_MEASUREMENT_ID:-}
        REACT_APP_GA_DEBUG: ${REACT_APP_GA_DEBUG:-false}
        REACT_APP_KEYCLOAK_URL: ${REACT_APP_KEYCLOAK_URL:-https://auth.pericopeai.com}
        REACT_APP_KEYCLOAK_REALM: ${REACT_APP_KEYCLOAK_REALM:-pericope}
        REACT_APP_KEYCLOAK_CLIENT_ID: ${REACT_APP_KEYCLOAK_CLIENT_ID:-pericope-web}
        REACT_APP_DISABLE_AUTH: ${REACT_APP_DISABLE_AUTH:-false}
    image: ${PERICOPE_FRONTEND_IMAGE:-pericopeai-frontend-prod:latest}
    environment:
      - NGINX_ENVSUBST_FILTER=SOLOMONIC_CLOCK_UPSTREAM|SOLOMONIC_CLOCK_GUIDED_PROMPTS_API_KEY
      - SOLOMONIC_CLOCK_UPSTREAM=${SOLOMONIC_CLOCK_UPSTREAM:-http://solomonic-clock:8080}
      - SOLOMONIC_CLOCK_GUIDED_PROMPTS_API_KEY=${SOLOMONIC_CLOCK_GUIDED_PROMPTS_API_KEY:-}
    ports:
      - "13080:80"                                              # host:container
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - pericope_net
    restart: unless-stopped

# Notes:
# - Paths are relative to this compose file (../AugustineCorpus, ../AugustineService, ../Solomonic_Seals, ../AugustineFE).
# - Shared network is fortress-phronesis-net.
# - Internal service DNS includes augustine-corpus-live, pericopeai-api, solomonic-clock, mysql.
