services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-rootpass}
      - MYSQL_DATABASE=${MYSQL_DB:-augustine_chat}
      - MYSQL_USER=${MYSQL_USER:-augustine}
      - MYSQL_PASSWORD=${MYSQL_PASS:-password}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - pericope_net

  augustine-corpus-live:
    build:
      context: ../AugustineCorpus
      dockerfile: Dockerfile
    image: ${PERICOPE_CORPUS_IMAGE:-pericope-corpus:latest}
    env_file:
      - ../AugustineCorpus/.env
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-dev}
      - ENV=${ENV:-dev}
      - CLIENT_ACCESS_PROFILE=${CLIENT_ACCESS_PROFILE:-}
      - CORPUS_VERSION=${CORPUS_VERSION:-dev}
      - RUN_INDEXING_ON_START=${RUN_INDEXING_ON_START:-0}
      - USE_MOCK_LLM=${USE_MOCK_LLM:-false}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-mistral}
      - AUTHOR_INDEX_MAP=${AUTHOR_INDEX_MAP:-}
      - INDEX_CACHE_SIZE=${INDEX_CACHE_SIZE:-16}
      - PREWARM_AUTHOR_INDEXES=${PREWARM_AUTHOR_INDEXES:-augustine,freud,solomon,plato,paul,marcus_aurelius,john_chrysostom,irenaeus,adam_smith,ludwig_von_mises}
      - TEXTS_ROOT=/app/texts
    expose:
      - "8001"                         # internal only; no host mapping
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/healthz', timeout=5).read()\""]
      interval: 15s
      timeout: 5s
      retries: 5
    volumes:
      - ../AugustineCorpus/texts/1_esdras_texts:/app/texts/1_esdras_texts:ro
