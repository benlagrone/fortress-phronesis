services:
  wordpress:
    build:
      context: ${AMA_WORDPRESS_ROOT:-/root/workspace/askmortgageauthority.com}
      dockerfile: Dockerfile
    image: ${AMA_WORDPRESS_IMAGE:-ama-wordpress:local}
    container_name: ama-wordpress
    env_file:
      - ${AMA_WORDPRESS_ROOT:-/root/workspace/askmortgageauthority.com}/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - wordpress_data:/var/www/html
      - ${AMA_WORDPRESS_ROOT:-/root/workspace/askmortgageauthority.com}/custom/wp-content/themes:/var/www/html/wp-content/themes
      - ${AMA_WORDPRESS_ROOT:-/root/workspace/askmortgageauthority.com}/custom/wp-content/plugins:/var/www/html/wp-content/plugins
      - ${AMA_WORDPRESS_ROOT:-/root/workspace/askmortgageauthority.com}/custom/wp-content/mu-plugins:/var/www/html/wp-content/mu-plugins
      - ${AMA_WORDPRESS_ROOT:-/root/workspace/askmortgageauthority.com}/data/uploads:/var/www/html/wp-content/uploads
    expose:
      - "9000" # php-fpm to nginx container
    restart: unless-stopped

  nginx:
    image: ${AMA_WORDPRESS_NGINX_IMAGE:-nginx:1.27-alpine}
    container_name: ama-wordpress-nginx
    depends_on:
      - wordpress
    ports:
      - "18020:80" # host nginx can proxy_pass to http://127.0.0.1:18020
    volumes:
      - wordpress_data:/var/www/html
      - ${AMA_WORDPRESS_ROOT:-/root/workspace/askmortgageauthority.com}/custom/wp-content/themes:/var/www/html/wp-content/themes
      - ${AMA_WORDPRESS_ROOT:-/root/workspace/askmortgageauthority.com}/custom/wp-content/plugins:/var/www/html/wp-content/plugins
      - ${AMA_WORDPRESS_ROOT:-/root/workspace/askmortgageauthority.com}/custom/wp-content/mu-plugins:/var/www/html/wp-content/mu-plugins
      - ${AMA_WORDPRESS_ROOT:-/root/workspace/askmortgageauthority.com}/data/uploads:/var/www/html/wp-content/uploads
      - ${AMA_WORDPRESS_ROOT:-/root/workspace/askmortgageauthority.com}/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  wordpress_data:
