services:
  thumbnail-wizard:
    image: ${THUMBNAIL_WIZARD_IMAGE:?THUMBNAIL_WIZARD_IMAGE is required}
    ports:
      - "${THUMBNAIL_WIZARD_HOST_BIND:-13082}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/asset-manifest.json >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
