schema_version: 1
environment: prod
apps:
  unicornjump:
    enabled: true
    release_channel: stable
    image_repo: ghcr.io/benlagrone/unicornjump-web
    compose_file: docker-compose.unicornjump.yml
    compose_project: unicornjump
    service: unicornjump-web
    local_health_urls:
      - http://127.0.0.1:13081/
      - http://127.0.0.1:13081/asset-manifest.json
    public_urls:
      - https://sapphirelagrone.com/
  thumbnail-wizard:
    enabled: true
    release_channel: stable
    image_repo: ghcr.io/benlagrone/freetols
    compose_file: docker-compose.thumbnail-wizard.yml
    compose_project: thumbnail-wizard
    service: thumbnail-wizard
    local_health_urls:
      - http://127.0.0.1:13082/
      - http://127.0.0.1:13082/asset-manifest.json
    public_urls:
      - https://freethumbnailwizard.com/
  lecrowndevelopment:
    enabled: true
    release_channel: stable
    image_repo: lecrown-site:latest
    compose_file: docker-compose.lecrowndevelopment.yml
    compose_project: lecrowndevelopment
    service: lecrown-site
    local_health_urls:
      - http://127.0.0.1:18032/
      - http://127.0.0.1:18032/api/lead/health
    public_urls:
      - https://lecrowndevelopment.com/
      - https://www.lecrowndevelopment.com/
  ama-calculators:
    enabled: true
    release_channel: stable
    image_repo: ghcr.io/benlagrone/calculator.askmortgageauthority.com
    compose_file: docker-compose.calculators.yml
    compose_project: fortress-phronesis
    service: calculators
    local_health_urls:
      - http://127.0.0.1:18010/healthz
      - http://127.0.0.1:18010/Annual-Percentage-Rate
    public_urls:
      - https://calculator.askmortgageauthority.com/
      - https://calculators.askmortgageauthority.com/
  solomonic-clock:
    enabled: true
    release_channel: stable
    image_repo: ghcr.io/benlagrone/solomonic-seals
    compose_file: docker-compose.pericope.yml
    compose_project: fortress-phronesis
    service: solomonic-clock
    local_health_urls:
      - http://127.0.0.1:8086/api/clock
      - http://127.0.0.1:8086/
    public_urls:
      - https://truevineos.cloud/
