server {
    listen 80;
    listen [::]:80;
    server_name fortresslegaltech.com www.fortresslegaltech.com;

    access_log /var/log/nginx/fortresslegaltech.com.access.log;
    error_log /var/log/nginx/fortresslegaltech.com.error.log;

    client_max_body_size 1m;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        proxy_pass http://127.0.0.1:18042;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}

