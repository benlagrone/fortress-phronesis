# HTTP-only bootstrap for the first certbot --webroot issuance.
# ACME is served from /var/www/letsencrypt. Nothing else is proxied:
# the observer tunnel and oauth2-proxy are not published until the HTTPS
# vhost in sextant.lecrowndevelopment.com.conf replaces this file.
# Do not enable this file and the HTTPS vhost at the same time.

server {
    listen 80;
    listen [::]:80;
    server_name sextant.lecrowndevelopment.com;

    access_log /var/log/nginx/sextant.lecrowndevelopment.com.access.log;
    error_log /var/log/nginx/sextant.lecrowndevelopment.com.error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        add_header Cache-Control "no-store" always;
        return 404;
    }
}
