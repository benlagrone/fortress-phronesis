# Sextant remote edge. Prepared config only; do not enable it until the
# go-live gate in docs/sextant-remote.md is open.
#
# Include this file once from the http context (sites-enabled). It defines
# the token map, the status rate-limit zone, and both upstreams.
#
# Before `nginx -t`, install a root:root mode 0600 map at
# /etc/nginx/sextant-status-tokens.map. That file is not in git. Start from
# deploy/nginx/sextant-status-tokens.map.example and replace every placeholder.
# The nginx master reads the map as root; do not mode it world-readable.
#
# Do not add $http_authorization to the access log format.

include /etc/nginx/sextant-status-tokens.map;

# Evaluated in the status auth subrequest. Anything except GET/HEAD is 403.
# GET/HEAD without a matching bearer token is 401. A match is 204.
map "$request_method:$sextant_status_ok" $sextant_status_gate {
    default "403";
    "GET:1"  "204";
    "HEAD:1" "204";
    "GET:0"  "401";
    "HEAD:0" "401";
}

# 30 requests/minute per client address, with a short burst. `nodelay`
# rejects the overflow instead of queueing bot polls.
limit_req_zone $binary_remote_addr zone=sextant_status:1m rate=30r/m;

upstream sextant_observer {
    server 127.0.0.1:18219;
    keepalive 8;
}

upstream sextant_oauth2_proxy {
    server 127.0.0.1:18046;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name sextant.lecrowndevelopment.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sextant.lecrowndevelopment.com;

    ssl_certificate /etc/letsencrypt/live/sextant.lecrowndevelopment.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sextant.lecrowndevelopment.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/sextant.lecrowndevelopment.com.access.log;
    error_log /var/log/nginx/sextant.lecrowndevelopment.com.error.log;

    add_header Cache-Control "no-store" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 1m;
    large_client_header_buffers 4 16k;

    # These observer routes stay unpublished. Exact match, no auth redirect.
    location = /healthz {
        return 404;
    }

    location = /v1/reports/feed.json {
        return 404;
    }

    location = /v1/production/portfolio/summary.json {
        return 404;
    }

    location = /_sextant_status_gate {
        internal;
        if ($sextant_status_gate = "403") {
            return 403;
        }
        if ($sextant_status_gate = "401") {
            return 401;
        }
        return 204;
    }

    # Bot status. Bearer tokens live only in the host map. No browser login.
    location = /status {
        limit_except GET HEAD {
            deny all;
        }
        limit_req zone=sextant_status burst=10 nodelay;

        auth_request /_sextant_status_gate;
        error_page 401 = @sextant_status_unauthorized;

        proxy_pass http://sextant_observer;
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_hide_header Cache-Control;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location @sextant_status_unauthorized {
        add_header WWW-Authenticate 'Bearer realm="sextant-status"' always;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        return 401;
    }

    location = /oauth2/auth {
        internal;
        proxy_pass http://sextant_oauth2_proxy;
        proxy_http_version 1.1;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Uri $request_uri;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
    }

    location /oauth2/ {
        proxy_pass http://sextant_oauth2_proxy;
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Auth-Request-Redirect $request_uri;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
    }

    # Browser UI. Arcade polls with fetch; do not upgrade WebSocket here.
    location / {
        auth_request /oauth2/auth;
        error_page 401 = /oauth2/sign_in;

        auth_request_set $sextant_auth_user $upstream_http_x_auth_request_user;
        auth_request_set $sextant_auth_email $upstream_http_x_auth_request_email;

        proxy_pass http://sextant_observer;
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_hide_header Cache-Control;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Auth-Request-User $sextant_auth_user;
        proxy_set_header X-Auth-Request-Email $sextant_auth_email;
        proxy_set_header Authorization "";
    }
}
