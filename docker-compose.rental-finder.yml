services:
  rental-finder-auth:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.3@sha256:10a1165743a192e1940b4708fb9647027185ce11a681a1c5519b442ff7f1f561
    container_name: rental-finder-auth
    restart: unless-stopped
    environment:
      OAUTH2_PROXY_PROVIDER: google
      OAUTH2_PROXY_CLIENT_ID: ${RENTAL_FINDER_GOOGLE_CLIENT_ID:?RENTAL_FINDER_GOOGLE_CLIENT_ID is required}
      OAUTH2_PROXY_CLIENT_SECRET: ${RENTAL_FINDER_GOOGLE_CLIENT_SECRET:?RENTAL_FINDER_GOOGLE_CLIENT_SECRET is required}
      OAUTH2_PROXY_COOKIE_SECRET: ${RENTAL_FINDER_OAUTH_COOKIE_SECRET:?RENTAL_FINDER_OAUTH_COOKIE_SECRET is required}
      OAUTH2_PROXY_REDIRECT_URL: https://rentalfinder.lecrownproperties.com/oauth2/callback
      OAUTH2_PROXY_EMAIL_DOMAINS: lecrownproperties.com
      OAUTH2_PROXY_SCOPE: openid profile email
      OAUTH2_PROXY_UPSTREAMS: static://202
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_PASS_ACCESS_TOKEN: "false"
      OAUTH2_PROXY_PASS_AUTHORIZATION_HEADER: "false"
      OAUTH2_PROXY_PASS_USER_HEADERS: "false"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_CODE_CHALLENGE_METHOD: S256
      OAUTH2_PROXY_COOKIE_NAME: __Host-rental_finder_session
      OAUTH2_PROXY_COOKIE_PATH: /
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_COOKIE_SAMESITE: lax
      OAUTH2_PROXY_COOKIE_EXPIRE: 8h
      OAUTH2_PROXY_COOKIE_REFRESH: 1h
      OAUTH2_PROXY_COOKIE_CSRF_PER_REQUEST: "true"
      OAUTH2_PROXY_COOKIE_CSRF_EXPIRE: 5m
      OAUTH2_PROXY_WHITELIST_DOMAINS: rentalfinder.lecrownproperties.com
      OAUTH2_PROXY_PROXY_PREFIX: /oauth2
      OAUTH2_PROXY_SILENCE_PING_LOGGING: "true"
      OAUTH2_PROXY_STANDARD_LOGGING: "true"
      OAUTH2_PROXY_AUTH_LOGGING: "true"
      OAUTH2_PROXY_REQUEST_LOGGING: "true"
    ports:
      - "127.0.0.1:18044:4180"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
