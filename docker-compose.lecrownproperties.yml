services:
  lecrown-properties-site:
    image: ${LECROWNPROPERTIES_IMAGE:?LECROWNPROPERTIES_IMAGE is required}
    container_name: lecrown-properties-site
    restart: unless-stopped
    environment:
      PORT: "8080"
      HOST: "0.0.0.0"
      GRIDSCOPE_EXTERNAL_API_URL: ${GRIDSCOPE_EXTERNAL_API_URL:-}
      GRIDSCOPE_EXTERNAL_API_KEY: ${GRIDSCOPE_EXTERNAL_API_KEY:-}
      GRIDSCOPE_EXTERNAL_API_AUTH_MODE: ${GRIDSCOPE_EXTERNAL_API_AUTH_MODE:-header}
      GRIDSCOPE_EXTERNAL_API_HEADER_NAME: ${GRIDSCOPE_EXTERNAL_API_HEADER_NAME:-X-API-Key}
      GRIDSCOPE_EXTERNAL_API_TIMEOUT_MS: ${GRIDSCOPE_EXTERNAL_API_TIMEOUT_MS:-15000}
      GRIDSCOPE_EXTERNAL_API_CACHE_TTL_SECONDS: ${GRIDSCOPE_EXTERNAL_API_CACHE_TTL_SECONDS:-300}
      KEYCLOAK_BASE_URL: ${KEYCLOAK_BASE_URL:-https://auth.pericopeai.com}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-lecrown-portal}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-lecrown-portal-web}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-}
      KEYCLOAK_REDIRECT_URI: ${KEYCLOAK_REDIRECT_URI:-}
      KEYCLOAK_PUBLIC_ORIGIN: ${KEYCLOAK_PUBLIC_ORIGIN:-https://lecrownproperties.com}
      KEYCLOAK_ALLOWED_ROLES: ${KEYCLOAK_ALLOWED_ROLES:-}
      KEYCLOAK_AUTH_SCOPE: ${KEYCLOAK_AUTH_SCOPE:-openid profile email}
      KEYCLOAK_SESSION_COOKIE_SECURE: ${KEYCLOAK_SESSION_COOKIE_SECURE:-auto}
      KEYCLOAK_TIMEOUT_MS: ${KEYCLOAK_TIMEOUT_MS:-10000}
    ports:
      - "127.0.0.1:18033:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
