services:
  lecrown-platform-api:
    image: ${LECROWNPLATFORM_API_IMAGE:-ghcr.io/benlagrone/lecrown-platform-api:latest}
    container_name: lecrown-platform-api
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-LeCrown Platform}
      DATABASE_URL: ${DATABASE_URL:-sqlite:///./data/lecrown.db}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://app.lecrowndevelopment.com,http://127.0.0.1:13082,http://localhost:13082}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      INTAKE_API_KEY: ${INTAKE_API_KEY:-}
      LINKEDIN_TOKEN: ${LINKEDIN_TOKEN:-}
      LINKEDIN_ORG_ID_DEV: ${LINKEDIN_ORG_ID_DEV:-}
      LINKEDIN_ORG_ID_PROP: ${LINKEDIN_ORG_ID_PROP:-}
      YOUTUBE_ACCESS_TOKEN_DEV: ${YOUTUBE_ACCESS_TOKEN_DEV:-}
      YOUTUBE_ACCESS_TOKEN_PROP: ${YOUTUBE_ACCESS_TOKEN_PROP:-}
      YOUTUBE_REFRESH_TOKEN_DEV: ${YOUTUBE_REFRESH_TOKEN_DEV:-}
      YOUTUBE_REFRESH_TOKEN_PROP: ${YOUTUBE_REFRESH_TOKEN_PROP:-}
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:-}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:-}
      YOUTUBE_CATEGORY_ID: ${YOUTUBE_CATEGORY_ID:-22}
      YOUTUBE_PRIVACY_STATUS: ${YOUTUBE_PRIVACY_STATUS:-private}
      VIDEO_RENDER_MODE: ${VIDEO_RENDER_MODE:-stub}
      VIDEO_SERVER_URL: ${VIDEO_SERVER_URL:-http://127.0.0.1:8001}
      VIDEO_RENDER_ENDPOINT: ${VIDEO_RENDER_ENDPOINT:-/render}
      VIDEO_RENDER_TIMEOUT_SECONDS: ${VIDEO_RENDER_TIMEOUT_SECONDS:-600}
      VIDEO_RENDER_DEFAULT_STYLE: ${VIDEO_RENDER_DEFAULT_STYLE:-default}
      VIDEO_STUB_VIDEO_PATH: ${VIDEO_STUB_VIDEO_PATH:-}
      VIDEO_STUB_VIDEO_URL: ${VIDEO_STUB_VIDEO_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ESPOCRM_BASE_URL: ${ESPOCRM_BASE_URL:-https://crm.lecrowndevelopment.com}
      ESPOCRM_API_KEY: ${ESPOCRM_API_KEY:-}
      ESPOCRM_USERNAME: ${ESPOCRM_USERNAME:-}
      ESPOCRM_PASSWORD: ${ESPOCRM_PASSWORD:-}
      ESPOCRM_TIMEOUT_SECONDS: ${ESPOCRM_TIMEOUT_SECONDS:-15}
      GOV_CONTRACT_SERVICE_URL: ${GOV_CONTRACT_SERVICE_URL:-https://www.txsmartbuy.gov/app/extensions/CPA/CPAMain/1.0.0/services/ESBD.Service.ss}
      GOV_CONTRACT_SOURCE_BASE_URL: ${GOV_CONTRACT_SOURCE_BASE_URL:-https://www.txsmartbuy.gov/esbd}
      GOV_CONTRACT_REQUEST_TIMEOUT_SECONDS: ${GOV_CONTRACT_REQUEST_TIMEOUT_SECONDS:-45}
      GOV_CONTRACT_WINDOW_DAYS: ${GOV_CONTRACT_WINDOW_DAYS:-7}
      GOV_CONTRACT_MATCH_MIN_SCORE: ${GOV_CONTRACT_MATCH_MIN_SCORE:-4}
      GOV_CONTRACT_EXTRA_KEYWORDS: ${GOV_CONTRACT_EXTRA_KEYWORDS:-}
      GMAIL_RFQ_FEED_URL: ${GMAIL_RFQ_FEED_URL:-}
      GMAIL_RFQ_FEED_LABEL: ${GMAIL_RFQ_FEED_LABEL:-RFQs/New}
      GMAIL_RFQ_FEED_TIMEOUT_SECONDS: ${GMAIL_RFQ_FEED_TIMEOUT_SECONDS:-20}
      GMAIL_RFQ_FEED_LIMIT: ${GMAIL_RFQ_FEED_LIMIT:-50}
      GMAIL_RFQ_MATCH_SCORE_FLOOR: ${GMAIL_RFQ_MATCH_SCORE_FLOOR:-6}
    volumes:
      - lecrown_platform_data:/app/data
    ports:
      - "127.0.0.1:18035:8000"

  lecrown-platform-admin:
    image: ${LECROWNPLATFORM_ADMIN_IMAGE:-ghcr.io/benlagrone/lecrown-platform-admin:latest}
    container_name: lecrown-platform-admin
    restart: unless-stopped
    depends_on:
      - lecrown-platform-api
    ports:
      - "127.0.0.1:13082:3000"

volumes:
  lecrown_platform_data:
