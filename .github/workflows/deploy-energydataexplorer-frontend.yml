name: Deploy Energy Data Explorer Frontend

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Commit SHA built by Energy Data Explorer frontend CI
        required: true
        type: string
      environment:
        description: Target environment
        required: true
        default: prod
        type: choice
        options:
          - prod
      run_public_smoke:
        description: Run apex-domain smoke checks after DNS and Nginx cutover
        required: true
        default: false
        type: boolean
  repository_dispatch:
    types:
      - deploy-energydataexplorer-frontend

permissions:
  contents: read

concurrency:
  group: energydataexplorer-frontend-${{ github.event_name == 'repository_dispatch' && github.event.client_payload.environment || inputs.environment || 'prod' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.environment || inputs.environment || 'prod' }}
    env:
      COMPOSE_PROJECT: energydataexplorer
      DEPLOY_ENVIRONMENT: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.environment || inputs.environment || 'prod' }}
      SOURCE_SHA: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.source_sha || inputs.source_sha }}
      IMAGE_REF: ghcr.io/benlagrone/energydataexplorer-frontend:sha-${{ github.event_name == 'repository_dispatch' && github.event.client_payload.source_sha || inputs.source_sha }}
    steps:
      - name: Resolve Trigger Inputs
        id: resolve
        shell: bash
        env:
          RAW_RUN_PUBLIC_SMOKE: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.run_public_smoke || inputs.run_public_smoke || false }}
        run: |
          set -euo pipefail

          if [ -z "${SOURCE_SHA:-}" ]; then
            echo "source_sha is required" >&2
            exit 1
          fi

          RUN_PUBLIC_SMOKE="$(printf '%s' "${RAW_RUN_PUBLIC_SMOKE:-false}" | tr '[:upper:]' '[:lower:]')"
          case "${RUN_PUBLIC_SMOKE}" in
            true|false)
              ;;
            *)
              echo "run_public_smoke must resolve to true or false" >&2
              exit 1
              ;;
          esac

          {
            echo "source_sha=${SOURCE_SHA}"
            echo "deploy_environment=${DEPLOY_ENVIRONMENT}"
            echo "run_public_smoke=${RUN_PUBLIC_SMOKE}"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout Fortress Repo
        uses: actions/checkout@v4

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.ENERGYDATAEXPLORER_FRONTEND_DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.ENERGYDATAEXPLORER_FRONTEND_DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy On Server
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.ENERGYDATAEXPLORER_FRONTEND_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.ENERGYDATAEXPLORER_FRONTEND_DEPLOY_USER }}
          DEPLOY_ROOT: ${{ secrets.ENERGYDATAEXPLORER_FRONTEND_DEPLOY_ROOT }}
          GHCR_READ_TOKEN: ${{ secrets.ENERGYDATAEXPLORER_FRONTEND_GHCR_READ_TOKEN }}
        run: |
          set -euo pipefail

          ssh -i ~/.ssh/id_ed25519 "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "ENERGYDATAEXPLORER_FRONTEND_IMAGE='${IMAGE_REF}' DEPLOY_ROOT='${DEPLOY_ROOT}' GHCR_READ_TOKEN='${GHCR_READ_TOKEN}' COMPOSE_PROJECT='${COMPOSE_PROJECT}' bash -s" <<'REMOTE'
          set -euo pipefail

          if [ ! -d "${DEPLOY_ROOT}/.git" ]; then
            install -d "$(dirname "${DEPLOY_ROOT}")"
            git clone https://github.com/benlagrone/fortress-phronesis.git "${DEPLOY_ROOT}"
          fi

          git -C "${DEPLOY_ROOT}" fetch origin main
          git -C "${DEPLOY_ROOT}" checkout main
          git -C "${DEPLOY_ROOT}" pull --ff-only origin main

          if [ -n "${GHCR_READ_TOKEN:-}" ]; then
            echo "${GHCR_READ_TOKEN}" | docker login ghcr.io -u benlagrone --password-stdin
          fi

          cd "${DEPLOY_ROOT}"

          ENERGYDATAEXPLORER_FRONTEND_IMAGE="${ENERGYDATAEXPLORER_FRONTEND_IMAGE}" \
            docker compose -p "${COMPOSE_PROJECT}" -f docker-compose.energydataexplorer.yml \
            pull energydataexplorer-frontend

          ENERGYDATAEXPLORER_FRONTEND_IMAGE="${ENERGYDATAEXPLORER_FRONTEND_IMAGE}" \
            docker compose -p "${COMPOSE_PROJECT}" -f docker-compose.energydataexplorer.yml \
            up -d energydataexplorer-frontend

          docker compose -p "${COMPOSE_PROJECT}" -f docker-compose.energydataexplorer.yml \
            ps energydataexplorer-frontend

          for url in \
            http://127.0.0.1:13083/ \
            http://127.0.0.1:13083/robots.txt \
            http://127.0.0.1:13083/sitemap.xml; do
            for attempt in $(seq 1 20); do
              if curl -fsSIL "$url" >/dev/null 2>&1; then
                break
              fi
              sleep 2
            done
            curl -fsSIL "$url" >/dev/null
          done
          REMOTE

      - name: Public Smoke
        if: ${{ steps.resolve.outputs.run_public_smoke == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSIL https://energydataexplorer.com/ >/dev/null
          curl -fsSIL https://www.energydataexplorer.com/ >/dev/null
          curl -fsS https://energydataexplorer.com/robots.txt >/dev/null
          curl -fsS https://energydataexplorer.com/sitemap.xml >/dev/null

      - name: Deployment Summary
        shell: bash
        run: |
          {
            echo "## Energy Data Explorer Frontend Deploy"
            echo ""
            echo "- Environment: \`${{ steps.resolve.outputs.deploy_environment }}\`"
            echo "- Source SHA: \`${{ steps.resolve.outputs.source_sha }}\`"
            echo "- Public smoke: \`${{ steps.resolve.outputs.run_public_smoke }}\`"
            echo "- Trigger: \`${{ github.event_name }}\`"
            echo "- Image: \`${IMAGE_REF}\`"
            echo "- Public URLs: https://energydataexplorer.com/ , https://www.energydataexplorer.com/"
          } >> "$GITHUB_STEP_SUMMARY"
