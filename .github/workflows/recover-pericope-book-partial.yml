name: Recover Pericope Book Partial

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    environment: prod
    env:
      COMPOSE_PROJECT: fortress-phronesis
    steps:
      - name: Checkout Fortress Repo
        uses: actions/checkout@v4

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.SOLOMONIC_CLOCK_DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.SOLOMONIC_CLOCK_DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Recover Book Partial On Server
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.SOLOMONIC_CLOCK_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.SOLOMONIC_CLOCK_DEPLOY_USER }}
          DEPLOY_ROOT: ${{ secrets.SOLOMONIC_CLOCK_DEPLOY_ROOT }}
        run: |
          set -euo pipefail

          ssh -i ~/.ssh/id_ed25519 "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "DEPLOY_ROOT='${DEPLOY_ROOT}' COMPOSE_PROJECT='${COMPOSE_PROJECT}' bash -s" <<'REMOTE'
          set -euo pipefail

          FORTRESS_REPO_URL="https://github.com/benlagrone/fortress-phronesis.git"
          FORTRESS_ROOT="${DEPLOY_ROOT}"
          WORKSPACE_ROOT="$(dirname "${DEPLOY_ROOT}")"
          CORPUS_ROOT="${WORKSPACE_ROOT}/AugustineCorpus"
          SERVICE_ROOT="${WORKSPACE_ROOT}/AugustineService"
          FE_ROOT="${WORKSPACE_ROOT}/AugustineFE"

          install -d "${WORKSPACE_ROOT}"

          if [ ! -d "${FORTRESS_ROOT}/.git" ]; then
            install -d "$(dirname "${FORTRESS_ROOT}")"
            git clone "${FORTRESS_REPO_URL}" "${FORTRESS_ROOT}"
          fi

          git -C "${FORTRESS_ROOT}" fetch origin main
          git -C "${FORTRESS_ROOT}" checkout main
          git -C "${FORTRESS_ROOT}" pull --ff-only origin main

          if [ ! -d "${CORPUS_ROOT}" ] || [ ! -f "${CORPUS_ROOT}/.env" ]; then
            if [ -d "${CORPUS_ROOT}" ]; then
              BROKEN_CORPUS_ROOT="${CORPUS_ROOT}.pre-book-partial-recover-$(date -u +%Y%m%dT%H%M%SZ)"
              mv "${CORPUS_ROOT}" "${BROKEN_CORPUS_ROOT}"
              echo "Moved incomplete AugustineCorpus workspace to ${BROKEN_CORPUS_ROOT}"
            fi
            BACKUP_PATH="$(ls -dt "${WORKSPACE_ROOT}"/AugustineCorpus.pre-codex-* "${WORKSPACE_ROOT}"/AugustineCorpus.pre-git-* 2>/dev/null | head -n1 || true)"
            [ -n "${BACKUP_PATH}" ] || {
              echo "::error::AugustineCorpus workspace is missing and no backup directory was found."
              exit 1
            }
            mv "${BACKUP_PATH}" "${CORPUS_ROOT}"
            echo "Restored AugustineCorpus from ${BACKUP_PATH}"
          fi

          if [ ! -d "${SERVICE_ROOT}" ]; then
            BACKUP_PATH="$(ls -dt "${WORKSPACE_ROOT}"/AugustineService.pre-codex-* 2>/dev/null | head -n1 || true)"
            [ -n "${BACKUP_PATH}" ] || {
              echo "::error::AugustineService checkout is missing and no backup directory was found."
              exit 1
            }
            mv "${BACKUP_PATH}" "${SERVICE_ROOT}"
            echo "Restored AugustineService from ${BACKUP_PATH}"
          fi

          for required_path in \
            "${CORPUS_ROOT}/.env" \
            "${CORPUS_ROOT}/texts/augustine_texts/city-of-god-v2.txt" \
            "${SERVICE_ROOT}/texts/augustine_texts/city-of-god-v2.txt" \
            "${SERVICE_ROOT}/texts/augustine_texts/doctrine.txt" \
            "${SERVICE_ROOT}/texts/augustine_texts/the_predestination_of_the_saints_gift_of_perseverance_FULL_TEXT.txt"; do
            [ -f "${required_path}" ] || {
              echo "::error::Missing required recovery file: ${required_path}"
              exit 1
            }
          done

          SERVICE_ROOT="${SERVICE_ROOT}" python3 - <<'PY'
          import os
          import textwrap
          from pathlib import Path

          path = Path(os.environ["SERVICE_ROOT"]) / "main.py"
          text = path.read_text(encoding="utf-8")

          if "_build_local_book_partial_payload" not in text:
              helper_block = textwrap.dedent("""

                  def _resolve_service_local_texts_dir(author_slug: str) -> str:
                      slug = str(author_slug or "").strip().lower()
                      if not slug:
                          raise HTTPException(status_code=400, detail="author_slug is required")
                      return os.path.join(os.path.dirname(__file__), "texts", f"{slug}_texts")


                  def _resolve_service_local_text_path(author_slug: str, source: str) -> str:
                      safe_source = os.path.basename(str(source or "").strip())
                      if not safe_source:
                          raise HTTPException(status_code=400, detail="source is required")
                      return os.path.join(_resolve_service_local_texts_dir(author_slug), safe_source)


                  def _build_local_book_partial_payload(request: BookPartialRequest) -> dict[str, Any]:
                      file_path = _resolve_service_local_text_path(request.author_slug, request.source)
                      if not os.path.exists(file_path):
                          raise HTTPException(status_code=404, detail="Book not found")

                      with open(file_path, "r", encoding="utf-8") as handle:
                          content = handle.read()

                      entries = _split_into_positions(content, os.path.basename(request.source))
                      if request.start_position < 1 or request.end_position < request.start_position:
                          raise HTTPException(status_code=400, detail="Invalid position range")
                      if not entries:
                          raise HTTPException(status_code=404, detail="Book content not available")

                      span = max(0, request.end_position - request.start_position)
                      start = min(max(1, request.start_position), len(entries))
                      end = min(start + span, len(entries))
                      selected = [entry for position, entry in entries if start <= position <= end]
                      if not selected:
                          raise HTTPException(status_code=404, detail="Book content not available")

                      book = str(request.book or "").strip() or os.path.splitext(os.path.basename(request.source))[0]
                      chapter = str(request.chapter or "").strip() or None
                      page = str(request.page or "").strip() or None
                      reference = f"{book} {chapter}" if chapter else book

                      return {
                          "author_slug": str(request.author_slug or "").strip().lower(),
                          "book": book,
                          "source": os.path.basename(request.source),
                          "chapter": chapter or "Unknown Chapter",
                          "page": page or "Unknown Page",
                          "start_position": start,
                          "end_position": end,
                          "reference": reference,
                          "section": "",
                          "testament": "",
                          "content": "\\n\\n".join(selected),
                      }
              """)
              marker = "\n\ndef _make_summary("
              if marker not in text:
                  raise SystemExit("Unable to locate _make_summary marker in AugustineService/main.py")
              text = text.replace(marker, helper_block + marker, 1)

          old_handler = """    except httpx.HTTPStatusError as e:\n        raise HTTPException(status_code=e.response.status_code, detail=e.response.text)\n"""
          new_handler = """    except httpx.HTTPStatusError as e:\n        if e.response.status_code == 404:\n            return _build_local_book_partial_payload(request)\n        raise HTTPException(status_code=e.response.status_code, detail=e.response.text)\n"""
          if new_handler not in text:
              if old_handler not in text:
                  raise SystemExit("Unable to locate book_partial HTTPStatusError handler in AugustineService/main.py")
              text = text.replace(old_handler, new_handler, 1)

          path.write_text(text, encoding="utf-8")
          print("service-main-patched")
          PY

          cd "${FORTRESS_ROOT}"

          docker compose -p "${COMPOSE_PROJECT}" -f docker-compose.pericope.yml up -d --build pericopeai-api
          docker compose -p "${COMPOSE_PROJECT}" -f docker-compose.pericope.yml exec -T pericopeai-api python create_tables.py
          docker compose -p "${COMPOSE_PROJECT}" -f docker-compose.pericope.yml ps pericopeai-api

          API_KEY="$(grep -m1 '^REACT_APP_AUGUSTINE_API_KEY=' "${FE_ROOT}/.env" | cut -d= -f2-)"
          [ -n "${API_KEY}" ] || {
            echo "::error::Missing REACT_APP_AUGUSTINE_API_KEY in ${FE_ROOT}/.env"
            exit 1
          }

          INTERNAL_RESPONSE="$(curl -fsS http://127.0.0.1:18000/api/v1/book_partial \
            -H 'Content-Type: application/json' \
            -H "X-API-Key: ${API_KEY}" \
            -d '{"author_slug":"augustine","book":"City-Of-God-V2","source":"city-of-god-v2.txt","chapter":"","page":"","start_position":1217,"end_position":1218}')"
          INTERNAL_RESPONSE="${INTERNAL_RESPONSE}" python3 - <<'PY'
          import json
          import os

          payload = json.loads(os.environ["INTERNAL_RESPONSE"])
          content = str(payload.get("content") or "").strip()
          if not content:
              raise SystemExit(f"empty internal payload: {payload}")
          if str(payload.get("source") or "") != "city-of-god-v2.txt":
              raise SystemExit(f"unexpected internal source: {payload}")
          print("internal-book-partial-ok")
          PY

          PUBLIC_RESPONSE="$(curl -fsS https://pericopeai.com/api/v1/book_partial \
            -H 'Content-Type: application/json' \
            -H "X-API-Key: ${API_KEY}" \
            -d '{"author_slug":"augustine","book":"City-Of-God-V2","source":"city-of-god-v2.txt","chapter":"","page":"","start_position":1217,"end_position":1218}')"
          PUBLIC_RESPONSE="${PUBLIC_RESPONSE}" python3 - <<'PY'
          import json
          import os

          payload = json.loads(os.environ["PUBLIC_RESPONSE"])
          content = str(payload.get("content") or "").strip()
          if not content:
              raise SystemExit(f"empty public payload: {payload}")
          if str(payload.get("source") or "") != "city-of-god-v2.txt":
              raise SystemExit(f"unexpected public source: {payload}")
          print("public-book-partial-ok")
          PY
          REMOTE

      - name: Public Health Smoke
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS https://pericopeai.com/api/healthz >/dev/null
