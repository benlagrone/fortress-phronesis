name: Recover Pericope Guided Prompts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    environment: prod
    env:
      COMPOSE_PROJECT: fortress-phronesis
    steps:
      - name: Checkout Fortress Repo
        uses: actions/checkout@v4

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.SOLOMONIC_CLOCK_DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.SOLOMONIC_CLOCK_DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Recover Guided Prompts On Server
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.SOLOMONIC_CLOCK_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.SOLOMONIC_CLOCK_DEPLOY_USER }}
          DEPLOY_ROOT: ${{ secrets.SOLOMONIC_CLOCK_DEPLOY_ROOT }}
        run: |
          set -euo pipefail

          ssh -i ~/.ssh/id_ed25519 "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "DEPLOY_ROOT='${DEPLOY_ROOT}' COMPOSE_PROJECT='${COMPOSE_PROJECT}' bash -s" <<'REMOTE'
          set -euo pipefail

          FORTRESS_ROOT="${DEPLOY_ROOT}"
          FORTRESS_ENV_FILE="${FORTRESS_ROOT}/.env"

          install -m 600 /dev/null "${FORTRESS_ENV_FILE}" 2>/dev/null || touch "${FORTRESS_ENV_FILE}"

          FORTRESS_ENV_FILE="${FORTRESS_ENV_FILE}" python3 - <<'PY'
          import os
          from pathlib import Path
          import secrets

          fortress_env = Path(os.environ["FORTRESS_ENV_FILE"])
          lines = fortress_env.read_text(encoding="utf-8").splitlines() if fortress_env.exists() else []
          current = {}
          for line in lines:
              if "=" not in line or line.lstrip().startswith("#"):
                  continue
              key, value = line.split("=", 1)
              current[key] = value.strip()

          shared_secret = (
              current.get("SOLOMONIC_GUIDED_PROMPTS_API_KEY")
              or current.get("SOLOMONIC_CLOCK_GUIDED_PROMPTS_API_KEY")
              or secrets.token_urlsafe(48)
          )

          updated = []
          seen_clock = False
          seen_upstream = False
          for line in lines:
              if line.startswith("SOLOMONIC_GUIDED_PROMPTS_API_KEY="):
                  updated.append(f"SOLOMONIC_GUIDED_PROMPTS_API_KEY={shared_secret}")
                  seen_upstream = True
              elif line.startswith("SOLOMONIC_CLOCK_GUIDED_PROMPTS_API_KEY="):
                  updated.append(f"SOLOMONIC_CLOCK_GUIDED_PROMPTS_API_KEY={shared_secret}")
                  seen_clock = True
              else:
                  updated.append(line)
          if not seen_upstream:
              updated.append(f"SOLOMONIC_GUIDED_PROMPTS_API_KEY={shared_secret}")
          if not seen_clock:
              updated.append(f"SOLOMONIC_CLOCK_GUIDED_PROMPTS_API_KEY={shared_secret}")
          fortress_env.write_text("\n".join(updated) + "\n", encoding="utf-8")
          print("guided-prompts-key-synced")
          print("guided-prompts-key-length=" + str(len(shared_secret)))
          PY

          cd "${FORTRESS_ROOT}"

          docker compose -p "${COMPOSE_PROJECT}" -f docker-compose.pericope.yml up -d --no-build --force-recreate solomonic-clock pericopeai-frontend
          docker compose -p "${COMPOSE_PROJECT}" -f docker-compose.pericope.yml ps solomonic-clock pericopeai-frontend

          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8086/api/clock >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8086/api/clock >/dev/null

          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:13080 >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:13080 >/dev/null

          INTERNAL_RESPONSE="$(curl -fsS http://127.0.0.1:13080/api/pericope/guided-prompts \
            -H 'Content-Type: application/json' \
            -d '{\"timezone\":\"America/Chicago\",\"as_of\":\"2026-04-27T11:40:00-05:00\",\"limit\":4,\"mode\":\"landing\",\"persona_hint\":\"augustine\"}')"
          INTERNAL_RESPONSE="${INTERNAL_RESPONSE}" python3 - <<'PY'
          import json
          import os

          payload = json.loads(os.environ["INTERNAL_RESPONSE"])
          prompts = payload.get("guided_prompts") or []
          if not prompts:
              raise SystemExit(f"guided prompts missing internally: {payload}")
          print("internal-guided-prompts-ok")
          PY

          PUBLIC_RESPONSE="$(curl -fsS https://pericopeai.com/api/pericope/guided-prompts \
            -H 'Content-Type: application/json' \
            -d '{\"timezone\":\"America/Chicago\",\"as_of\":\"2026-04-27T11:40:00-05:00\",\"limit\":4,\"mode\":\"landing\",\"persona_hint\":\"augustine\"}')"
          PUBLIC_RESPONSE="${PUBLIC_RESPONSE}" python3 - <<'PY'
          import json
          import os

          payload = json.loads(os.environ["PUBLIC_RESPONSE"])
          prompts = payload.get("guided_prompts") or []
          if not prompts:
              raise SystemExit(f"guided prompts missing publicly: {payload}")
          print("public-guided-prompts-ok")
          PY
          REMOTE

      - name: Public Health Smoke
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS https://pericopeai.com/api/healthz >/dev/null
