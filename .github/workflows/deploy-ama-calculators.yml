name: Deploy AMA Calculators

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Commit SHA built by calculators CI
        required: true
        type: string
      environment:
        description: Target environment
        required: true
        default: prod
        type: choice
        options:
          - prod

permissions:
  contents: read

concurrency:
  group: ama-calculators-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      COMPOSE_PROJECT: fortress-phronesis
      IMAGE_REF: ghcr.io/benlagrone/calculator.askmortgageauthority.com:sha-${{ inputs.source_sha }}
    steps:
      - name: Checkout Fortress Repo
        uses: actions/checkout@v4

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.AMA_CALCULATORS_DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.AMA_CALCULATORS_DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy On Server
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.AMA_CALCULATORS_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.AMA_CALCULATORS_DEPLOY_USER }}
          DEPLOY_ROOT: ${{ secrets.AMA_CALCULATORS_DEPLOY_ROOT }}
          GHCR_READ_TOKEN: ${{ secrets.AMA_CALCULATORS_GHCR_READ_TOKEN }}
        run: |
          set -euo pipefail

          ssh -i ~/.ssh/id_ed25519 "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "AMA_CALCULATORS_IMAGE='${IMAGE_REF}' DEPLOY_ROOT='${DEPLOY_ROOT}' GHCR_READ_TOKEN='${GHCR_READ_TOKEN}' COMPOSE_PROJECT='${COMPOSE_PROJECT}' bash -s" <<'REMOTE'
          set -euo pipefail

          install -d "$(dirname "${DEPLOY_ROOT}")"
          RELEASE_ROOT="$(mktemp -d "$(dirname "${DEPLOY_ROOT}")/ama-calculators-deploy.XXXXXX")"
          trap 'rm -rf "${RELEASE_ROOT}"' EXIT
          git clone --depth 1 --branch main https://github.com/benlagrone/fortress-phronesis.git "${RELEASE_ROOT}"

          if [ -n "${GHCR_READ_TOKEN:-}" ]; then
            echo "${GHCR_READ_TOKEN}" | docker login ghcr.io -u benlagrone --password-stdin
          fi

          cd "${RELEASE_ROOT}"

          AMA_CALCULATORS_IMAGE="${AMA_CALCULATORS_IMAGE}" docker compose -p "${COMPOSE_PROJECT}" -f docker-compose.calculators.yml pull calculators
          AMA_CALCULATORS_IMAGE="${AMA_CALCULATORS_IMAGE}" docker compose -p "${COMPOSE_PROJECT}" -f docker-compose.calculators.yml up -d calculators
          docker compose -p "${COMPOSE_PROJECT}" -f docker-compose.calculators.yml ps calculators

          for url in http://127.0.0.1:18010/healthz http://127.0.0.1:18010/Annual-Percentage-Rate; do
            for attempt in $(seq 1 20); do
              if curl -fsS "$url" >/dev/null 2>&1; then
                break
              fi
              sleep 2
            done
            curl -fsS "$url" >/dev/null
          done
          REMOTE

      - name: Public Smoke
        shell: bash
        run: |
          set -euo pipefail
          for url in \
            https://calculator.askmortgageauthority.com/healthz \
            https://calculator.askmortgageauthority.com/Annual-Percentage-Rate; do
            curl -fsS "$url" >/dev/null
          done

      - name: Deployment Summary
        shell: bash
        run: |
          {
            echo "## AMA Calculators Deploy"
            echo ""
            echo "- Environment: \`${{ inputs.environment }}\`"
            echo "- Source SHA: \`${{ inputs.source_sha }}\`"
            echo "- Image: \`${IMAGE_REF}\`"
            echo "- Public URL: https://calculator.askmortgageauthority.com/"
          } >> "$GITHUB_STEP_SUMMARY"
