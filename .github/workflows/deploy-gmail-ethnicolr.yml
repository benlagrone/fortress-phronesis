name: Deploy Gmail Ethnicolr

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gmail-ethnicolr-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      APP_REPO: benlagrone/gmail_ethnicolr_tagger
      APP_IMAGE: ghcr.io/benlagrone/gmail_ethnicolr_tagger:latest
      GOOGLE_EXPECTED_EMAIL: benjaminlagrone@gmail.com
    steps:
      - name: Checkout Fortress Repo
        uses: actions/checkout@v4

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s' "${{ secrets.UNICORNJUMP_DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s' "${{ secrets.UNICORNJUMP_DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy On Server
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.UNICORNJUMP_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.UNICORNJUMP_DEPLOY_USER }}
          GHCR_READ_TOKEN: ${{ secrets.UNICORNJUMP_GHCR_READ_TOKEN }}
          REPO_PULL_TOKEN: ${{ secrets.GMAIL_ETHNICOLR_REPO_PULL_TOKEN }}
          CLIENT_SECRET_JSON: ${{ secrets.GMAIL_ETHNICOLR_CLIENT_SECRET_JSON }}
          TOKEN_PKL_B64: ${{ secrets.GMAIL_ETHNICOLR_TOKEN_PKL_B64 }}
        run: bash scripts/deploy-gmail-ethnicolr.sh

      - name: Deployment Summary
        shell: bash
        run: |
          {
            echo "## Gmail Ethnicolr Deploy"
            echo ""
            echo "- App image: \`${APP_IMAGE}\`"
            echo "- Remote repo: \`${APP_REPO}\`"
            echo "- Expected Gmail account: \`${GOOGLE_EXPECTED_EMAIL}\`"
            echo "- Schedule: every 4 hours once a token is present"
          } >> "$GITHUB_STEP_SUMMARY"
