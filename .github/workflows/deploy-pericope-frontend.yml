name: Deploy Pericope Frontend

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Commit SHA built by AugustineFE CI
        required: true
        type: string
      environment:
        description: Target environment
        required: true
        default: prod
        type: choice
        options:
          - prod

permissions:
  contents: read

concurrency:
  group: pericope-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      COMPOSE_PROJECT: fortress-phronesis
    steps:
      - name: Checkout Fortress Repo
        uses: actions/checkout@v4

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.SOLOMONIC_CLOCK_DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.SOLOMONIC_CLOCK_DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy On Server
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.SOLOMONIC_CLOCK_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.SOLOMONIC_CLOCK_DEPLOY_USER }}
          DEPLOY_ROOT: ${{ secrets.SOLOMONIC_CLOCK_DEPLOY_ROOT }}
        run: |
          set -euo pipefail

          ssh-keygen -lf ~/.ssh/id_ed25519 >/dev/null 2>&1 || {
            echo "::error::SOLOMONIC_CLOCK_DEPLOY_SSH_KEY is missing or invalid."
            exit 1
          }
          [ -n "${DEPLOY_HOST:-}" ] || {
            echo "::error::SOLOMONIC_CLOCK_DEPLOY_HOST is missing."
            exit 1
          }
          [ -n "${DEPLOY_USER:-}" ] || {
            echo "::error::SOLOMONIC_CLOCK_DEPLOY_USER is missing."
            exit 1
          }
          [ -n "${DEPLOY_ROOT:-}" ] || {
            echo "::error::SOLOMONIC_CLOCK_DEPLOY_ROOT is missing."
            exit 1
          }

          set +e
          ssh -i ~/.ssh/id_ed25519 "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "SOURCE_SHA='${{ inputs.source_sha }}' DEPLOY_ROOT='${DEPLOY_ROOT}' COMPOSE_PROJECT='${COMPOSE_PROJECT}' bash -s" \
            2>deploy-ssh.stderr <<'REMOTE'
          set -euo pipefail
          WORKSPACE_ROOT="$(dirname "${DEPLOY_ROOT}")"
          FE_ROOT="${WORKSPACE_ROOT}/AugustineFE"
          timestamp="$(date -u +%Y%m%dT%H%M%SZ)"

          if [ -d "${DEPLOY_ROOT}" ] && [ ! -d "${DEPLOY_ROOT}/.git" ]; then
            mv "${DEPLOY_ROOT}" "${DEPLOY_ROOT}.pre-git-${timestamp}"
          fi

          if [ ! -d "${DEPLOY_ROOT}/.git" ]; then
            install -d "$(dirname "${DEPLOY_ROOT}")"
            git clone https://github.com/benlagrone/fortress-phronesis.git "${DEPLOY_ROOT}"
          fi

          if [ -d "${FE_ROOT}" ] && [ ! -d "${FE_ROOT}/.git" ]; then
            mv "${FE_ROOT}" "${FE_ROOT}.pre-git-${timestamp}"
          fi

          if [ ! -d "${FE_ROOT}/.git" ]; then
            git clone https://github.com/benlagrone/AugustineFE.git "${FE_ROOT}"
          fi

          git -C "${DEPLOY_ROOT}" fetch origin main
          git -C "${DEPLOY_ROOT}" checkout main
          git -C "${DEPLOY_ROOT}" merge --ff-only FETCH_HEAD

          if ! git -C "${FE_ROOT}" diff --quiet || ! git -C "${FE_ROOT}" diff --cached --quiet; then
            stash_label="pericope-frontend-predeploy-${SOURCE_SHA}-$(date -u +%Y%m%dT%H%M%SZ)"
            git -C "${FE_ROOT}" stash push --message "${stash_label}" >/dev/null
            echo "Stashed tracked AugustineFE changes as ${stash_label}."
          fi

          git -C "${FE_ROOT}" fetch origin master
          git -C "${FE_ROOT}" checkout master
          git -C "${FE_ROOT}" merge --ff-only FETCH_HEAD
          resolved_source_sha="$(git -C "${FE_ROOT}" rev-parse --verify "${SOURCE_SHA}^{commit}")"
          actual_sha="$(git -C "${FE_ROOT}" rev-parse HEAD)"
          if [ "${actual_sha}" != "${resolved_source_sha}" ]; then
            echo "::error::AugustineFE HEAD ${actual_sha} does not match requested source SHA ${resolved_source_sha}."
            exit 1
          fi

          install -d "${WORKSPACE_ROOT}/AugustineCorpus"
          if [ ! -f "${WORKSPACE_ROOT}/AugustineCorpus/.env" ]; then
            : > "${WORKSPACE_ROOT}/AugustineCorpus/.env"
          fi

          install -d "${WORKSPACE_ROOT}/AugustineService"
          if [ ! -f "${WORKSPACE_ROOT}/AugustineService/.env" ]; then
            service_backup_root="$(ls -1dt "${WORKSPACE_ROOT}"/AugustineService.pre-deploy-* "${WORKSPACE_ROOT}"/AugustineService.pre-git-* "${WORKSPACE_ROOT}"/AugustineService.pre-codex-* 2>/dev/null | head -n 1 || true)"
            if [ -n "${service_backup_root:-}" ] && [ -f "${service_backup_root}/.env" ]; then
              cp "${service_backup_root}/.env" "${WORKSPACE_ROOT}/AugustineService/.env"
            else
              : > "${WORKSPACE_ROOT}/AugustineService/.env"
            fi
          fi

          cd "${DEPLOY_ROOT}"

          bash scripts/verify-pericope-deploy-lock.sh

          docker compose --env-file "${FE_ROOT}/.env" -p "${COMPOSE_PROJECT}" -f docker-compose.pericope.yml up -d --build pericopeai-frontend
          docker compose -p "${COMPOSE_PROJECT}" -f docker-compose.pericope.yml ps pericopeai-frontend

          for url in http://127.0.0.1:13080/; do
            for attempt in $(seq 1 20); do
              if curl -fsSI "$url" >/dev/null 2>&1; then
                break
              fi
              sleep 2
            done
            curl -fsSI "$url" >/dev/null
          done
          REMOTE
          status=$?
          set -e

          if [ "$status" -ne 0 ]; then
            detail="$(tail -n 20 deploy-ssh.stderr | tr '\n' ' ' | sed 's/  */ /g')"
            echo "::error::Pericope frontend deploy failed with exit ${status}. ${detail}"
            exit "$status"
          fi

      - name: Public Smoke
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSI https://pericopeai.com/ >/dev/null

      - name: Deployment Summary
        shell: bash
        run: |
          {
            echo "## Pericope Frontend Deploy"
            echo ""
            echo "- Environment: \`${{ inputs.environment }}\`"
            echo "- Source SHA: \`${{ inputs.source_sha }}\`"
            echo "- Deploy mode: \`source build on server\`"
            echo "- Public URL: https://pericopeai.com/"
          } >> "$GITHUB_STEP_SUMMARY"
