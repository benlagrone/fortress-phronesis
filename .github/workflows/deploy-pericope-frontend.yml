name: Deploy Pericope Frontend

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Commit SHA built by AugustineFE CI
        required: true
        type: string
      environment:
        description: Target environment
        required: true
        default: prod
        type: choice
        options:
          - prod
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-pericope-frontend.yml'
      - 'deploy/releases/pericope-frontend.json'

permissions:
  contents: read

concurrency:
  group: pericope-frontend-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    env:
      COMPOSE_PROJECT: fortress-phronesis
    steps:
      - name: Checkout Fortress Repo
        uses: actions/checkout@v4

      - name: Resolve Release Target
        id: target
        shell: bash
        env:
          DEFAULT_SOURCE_SHA: ${{ inputs.source_sha }}
          DEFAULT_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "source_sha=${DEFAULT_SOURCE_SHA}" >> "$GITHUB_OUTPUT"
            echo "environment=${DEFAULT_ENVIRONMENT}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json

          with open("deploy/releases/pericope-frontend.json", "r", encoding="utf-8") as fh:
              data = json.load(fh)

          print(f"source_sha={data['source_sha']}")
          print(f"environment={data.get('environment', 'prod')}")
          PY

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.SOLOMONIC_CLOCK_DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.SOLOMONIC_CLOCK_DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy On Server
        shell: bash
        env:
          IMAGE_REF: ghcr.io/benlagrone/pericopeai-frontend-prod:sha-${{ steps.target.outputs.source_sha }}
          DEPLOY_HOST: ${{ secrets.SOLOMONIC_CLOCK_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.SOLOMONIC_CLOCK_DEPLOY_USER }}
          DEPLOY_ROOT: ${{ secrets.SOLOMONIC_CLOCK_DEPLOY_ROOT }}
          GHCR_READ_TOKEN: ${{ secrets.SOLOMONIC_CLOCK_GHCR_READ_TOKEN }}
        run: |
          set -euo pipefail

          ssh-keygen -lf ~/.ssh/id_ed25519 >/dev/null 2>&1 || {
            echo "::error::SOLOMONIC_CLOCK_DEPLOY_SSH_KEY is missing or invalid."
            exit 1
          }
          [ -n "${DEPLOY_HOST:-}" ] || {
            echo "::error::SOLOMONIC_CLOCK_DEPLOY_HOST is missing."
            exit 1
          }
          [ -n "${DEPLOY_USER:-}" ] || {
            echo "::error::SOLOMONIC_CLOCK_DEPLOY_USER is missing."
            exit 1
          }
          [ -n "${DEPLOY_ROOT:-}" ] || {
            echo "::error::SOLOMONIC_CLOCK_DEPLOY_ROOT is missing."
            exit 1
          }

          set +e
          ssh -i ~/.ssh/id_ed25519 "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "PERICOPE_FRONTEND_IMAGE='${IMAGE_REF}' DEPLOY_ROOT='${DEPLOY_ROOT}' GHCR_READ_TOKEN='${GHCR_READ_TOKEN}' COMPOSE_PROJECT='${COMPOSE_PROJECT}' bash -s" <<'REMOTE'
          set -euo pipefail

          if [ ! -d "${DEPLOY_ROOT}/.git" ]; then
            install -d "$(dirname "${DEPLOY_ROOT}")"
            git clone https://github.com/benlagrone/fortress-phronesis.git "${DEPLOY_ROOT}"
          fi

          git -C "${DEPLOY_ROOT}" fetch origin main
          git -C "${DEPLOY_ROOT}" checkout main
          git -C "${DEPLOY_ROOT}" pull --ff-only origin main

          if [ -n "${GHCR_READ_TOKEN:-}" ]; then
            echo "${GHCR_READ_TOKEN}" | docker login ghcr.io -u benlagrone --password-stdin
          fi

          cd "${DEPLOY_ROOT}"

          bash scripts/verify-pericope-deploy-lock.sh

          PERICOPE_FRONTEND_IMAGE="${PERICOPE_FRONTEND_IMAGE}" docker compose -p "${COMPOSE_PROJECT}" -f docker-compose.pericope.yml pull pericopeai-frontend
          PERICOPE_FRONTEND_IMAGE="${PERICOPE_FRONTEND_IMAGE}" docker compose -p "${COMPOSE_PROJECT}" -f docker-compose.pericope.yml up -d pericopeai-frontend
          docker compose -p "${COMPOSE_PROJECT}" -f docker-compose.pericope.yml ps pericopeai-frontend

          for url in http://127.0.0.1:13080/; do
            for attempt in $(seq 1 20); do
              if curl -fsSI "$url" >/dev/null 2>&1; then
                break
              fi
              sleep 2
            done
            curl -fsSI "$url" >/dev/null
          done
          REMOTE 2>deploy-ssh.stderr
          status=$?
          set -e

          if [ "$status" -ne 0 ]; then
            detail="$(tail -n 20 deploy-ssh.stderr | tr '\n' ' ' | sed 's/  */ /g')"
            echo "::error::Pericope frontend deploy failed with exit ${status}. ${detail}"
            exit "$status"
          fi

      - name: Public Smoke
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSI https://pericopeai.com/ >/dev/null

      - name: Deployment Summary
        shell: bash
        run: |
          {
            echo "## Pericope Frontend Deploy"
            echo ""
            echo "- Environment: \`${{ steps.target.outputs.environment }}\`"
            echo "- Source SHA: \`${{ steps.target.outputs.source_sha }}\`"
            echo "- Image: \`${IMAGE_REF}\`"
            echo "- Public URL: https://pericopeai.com/"
          } >> "$GITHUB_STEP_SUMMARY"
