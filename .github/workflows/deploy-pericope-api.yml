name: Deploy Pericope API

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-pericope-api.yml"
      - "docker-compose.pericope.yml"
      - "scripts/update-nginx-pericopeai.sh"
      - "scripts/verify-pericope-author-profiles.py"
      - "scripts/verify-pericope-deploy-lock.sh"
      - "scripts/deploy-pericopeai-prod.sh"
  workflow_dispatch:
    inputs:
      service_ref:
        description: AugustineService branch to deploy
        required: true
        default: master
        type: string
      source_sha:
        description: Optional AugustineService commit SHA to deploy
        required: false
        type: string

permissions:
  contents: read

env:
  REQUIRED_PUBLIC_AUTHOR_SLUGS: augustine,eusebius_pamphilus,john_chrysostom,machiavelli,epictetus,seneca,musonius_rufus,hermes_trismegistus,athanasius_of_alexandria,origen_of_alexandria,cyprian_of_carthage,boethius,anselm_of_canterbury

concurrency:
  group: pericope-api-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    env:
      COMPOSE_PROJECT: fortress-phronesis
    steps:
      - name: Checkout Fortress Repo
        uses: actions/checkout@v4

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.SOLOMONIC_CLOCK_DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.SOLOMONIC_CLOCK_DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy On Server
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.SOLOMONIC_CLOCK_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.SOLOMONIC_CLOCK_DEPLOY_USER }}
          DEPLOY_ROOT: ${{ secrets.SOLOMONIC_CLOCK_DEPLOY_ROOT }}
          INPUT_SERVICE_REF: ${{ github.event.inputs.service_ref }}
          INPUT_SOURCE_SHA: ${{ github.event.inputs.source_sha }}
        run: |
          set -euo pipefail

          SERVICE_REF="${INPUT_SERVICE_REF:-master}"
          SOURCE_SHA="${INPUT_SOURCE_SHA:-}"
          SSH_OPTS=(
            -i ~/.ssh/id_ed25519
            -o BatchMode=yes
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=20
            -o TCPKeepAlive=yes
          )

          ssh "${SSH_OPTS[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "DEPLOY_ROOT='${DEPLOY_ROOT}' SERVICE_REF='${SERVICE_REF}' SOURCE_SHA='${SOURCE_SHA}' COMPOSE_PROJECT='${COMPOSE_PROJECT}' REQUIRED_PUBLIC_AUTHOR_SLUGS='${REQUIRED_PUBLIC_AUTHOR_SLUGS}' bash -s" <<'REMOTE'
          set -euo pipefail

          FORTRESS_REPO_URL="git@github.com:benlagrone/fortress-phronesis.git"
          CORPUS_REPO_URL="git@github.com:benlagrone/AugustineCorpus.git"
          SERVICE_REPO_URL="git@github.com:benlagrone/AugustineService.git"
          FE_REPO_URL="git@github.com:benlagrone/AugustineFE.git"
          PRIMARY_FORTRESS_ROOT="${DEPLOY_ROOT}"
          WORKSPACE_ROOT="$(dirname "${DEPLOY_ROOT}")"
          FORTRESS_ROOT="${PRIMARY_FORTRESS_ROOT}"
          if [ -d "${PRIMARY_FORTRESS_ROOT}/.git" ] && [ -n "$(git -C "${PRIMARY_FORTRESS_ROOT}" status --porcelain --untracked-files=all)" ]; then
            FORTRESS_ROOT="${WORKSPACE_ROOT}/fortress-phronesis-deploy"
            echo "Primary Fortress checkout is dirty; using clean deploy checkout ${FORTRESS_ROOT}"
          fi
          CORPUS_ROOT="${WORKSPACE_ROOT}/AugustineCorpus"
          SERVICE_ROOT="${WORKSPACE_ROOT}/AugustineService"
          FE_ROOT="${WORKSPACE_ROOT}/AugustineFE"
          CORPUS_ENV_BACKUP="${WORKSPACE_ROOT}/.pericope-corpus.env.restore"
          SERVICE_ENV_BACKUP="${WORKSPACE_ROOT}/.pericope-service.env.restore"
          FE_ENV_BACKUP="${WORKSPACE_ROOT}/.pericope-fe.env.restore"
          timestamp="$(date -u +%Y%m%dT%H%M%SZ)"

          restore_env_file() {
            local backup_path="$1"
            local target_path="$2"
            if [ ! -f "${backup_path}" ]; then
              return 0
            fi
            if cp "${backup_path}" "${target_path}" 2>/dev/null; then
              return 0
            fi
            if command -v sudo >/dev/null 2>&1 && sudo -n true >/dev/null 2>&1; then
              if sudo cp "${backup_path}" "${target_path}" 2>/dev/null; then
                return 0
              fi
            fi
            if [ -s "${target_path}" ]; then
              echo "Preserving existing ${target_path}; backup restore was not permitted."
              return 0
            fi
            echo "::error::Unable to restore ${target_path}; file is not writable and passwordless sudo is unavailable."
            exit 1
          }

          install -d "${WORKSPACE_ROOT}"

          if [ -d "${FORTRESS_ROOT}" ] && [ ! -d "${FORTRESS_ROOT}/.git" ]; then
            mv "${FORTRESS_ROOT}" "${FORTRESS_ROOT}.pre-git-${timestamp}"
          fi
          if [ -d "${FORTRESS_ROOT}/.git" ] && [ -n "$(git -C "${FORTRESS_ROOT}" status --porcelain --untracked-files=all)" ]; then
            mv "${FORTRESS_ROOT}" "${FORTRESS_ROOT}.dirty-${timestamp}"
          fi

          if [ ! -d "${FORTRESS_ROOT}/.git" ]; then
            install -d "$(dirname "${FORTRESS_ROOT}")"
            git clone "${FORTRESS_REPO_URL}" "${FORTRESS_ROOT}"
          fi
          git -C "${FORTRESS_ROOT}" remote set-url origin "${FORTRESS_REPO_URL}"

          if [ -f "${SERVICE_ROOT}/.env" ]; then
            cp "${SERVICE_ROOT}/.env" "${SERVICE_ENV_BACKUP}"
          else
            backup_root="$(ls -1dt "${SERVICE_ROOT}".pre-deploy-* "${SERVICE_ROOT}".pre-git-* "${SERVICE_ROOT}".pre-codex-* 2>/dev/null | head -n 1 || true)"
            if [ -n "${backup_root:-}" ] && [ -f "${backup_root}/.env" ]; then
              cp "${backup_root}/.env" "${SERVICE_ENV_BACKUP}"
            fi
          fi

          if [ -d "${SERVICE_ROOT}" ]; then
            mv "${SERVICE_ROOT}" "${SERVICE_ROOT}.pre-deploy-${timestamp}"
          fi
          if [ ! -d "${SERVICE_ROOT}/.git" ]; then
            git clone "${SERVICE_REPO_URL}" "${SERVICE_ROOT}"
          fi
          git -C "${SERVICE_ROOT}" remote set-url origin "${SERVICE_REPO_URL}"

          if [ -f "${CORPUS_ROOT}/.env" ]; then
            cp "${CORPUS_ROOT}/.env" "${CORPUS_ENV_BACKUP}"
          else
            backup_root="$(ls -1dt "${CORPUS_ROOT}".pre-api-deploy-* "${CORPUS_ROOT}".pre-codex-* "${CORPUS_ROOT}".pre-git-* 2>/dev/null | head -n 1 || true)"
            if [ -n "${backup_root:-}" ] && [ -f "${backup_root}/.env" ]; then
              cp "${backup_root}/.env" "${CORPUS_ENV_BACKUP}"
            fi
          fi

          if [ -f "${FE_ROOT}/.env" ]; then
            cp "${FE_ROOT}/.env" "${FE_ENV_BACKUP}"
          else
            backup_root="$(ls -1dt "${FE_ROOT}".pre-git-* 2>/dev/null | head -n 1 || true)"
            if [ -n "${backup_root:-}" ] && [ -f "${backup_root}/.env" ]; then
              cp "${backup_root}/.env" "${FE_ENV_BACKUP}"
            fi
          fi

          if [ -d "${FE_ROOT}" ] && [ ! -d "${FE_ROOT}/.git" ]; then
            mv "${FE_ROOT}" "${FE_ROOT}.pre-git-${timestamp}"
          fi
          if [ ! -d "${FE_ROOT}/.git" ]; then
            git clone "${FE_REPO_URL}" "${FE_ROOT}"
          fi
          git -C "${FE_ROOT}" remote set-url origin "${FE_REPO_URL}"

          git -C "${FORTRESS_ROOT}" fetch origin main
          git -C "${FORTRESS_ROOT}" checkout main
          git -C "${FORTRESS_ROOT}" pull --ff-only origin main

          if [ ! -d "${CORPUS_ROOT}" ] || [ ! -f "${CORPUS_ROOT}/Dockerfile" ] || [ ! -f "${CORPUS_ROOT}/.env" ]; then
            if [ -d "${CORPUS_ROOT}" ]; then
              broken_corpus_root="${CORPUS_ROOT}.pre-api-deploy-${timestamp}"
              mv "${CORPUS_ROOT}" "${broken_corpus_root}"
              echo "Moved incomplete AugustineCorpus workspace to ${broken_corpus_root}"
            fi
            backup_root="$(ls -1dt "${CORPUS_ROOT}".pre-codex-* "${CORPUS_ROOT}".pre-git-* 2>/dev/null | head -n 1 || true)"
            [ -n "${backup_root:-}" ] || {
              echo "::error::AugustineCorpus workspace is missing and no backup directory was found."
              exit 1
            }
            mv "${backup_root}" "${CORPUS_ROOT}"
            echo "Restored AugustineCorpus from ${backup_root}"
          fi

          if [ -d "${CORPUS_ROOT}" ] && [ ! -d "${CORPUS_ROOT}/.git" ]; then
            mv "${CORPUS_ROOT}" "${CORPUS_ROOT}.pre-git-${timestamp}"
          fi
          if [ ! -d "${CORPUS_ROOT}/.git" ]; then
            git clone "${CORPUS_REPO_URL}" "${CORPUS_ROOT}"
          fi
          git -C "${CORPUS_ROOT}" remote set-url origin "${CORPUS_REPO_URL}"

          git -C "${CORPUS_ROOT}" fetch origin master
          git -C "${CORPUS_ROOT}" checkout master
          git -C "${CORPUS_ROOT}" pull --ff-only origin master

          git -C "${SERVICE_ROOT}" fetch origin "${SERVICE_REF}"
          git -C "${SERVICE_ROOT}" checkout "${SERVICE_REF}"
          git -C "${SERVICE_ROOT}" pull --ff-only origin "${SERVICE_REF}"
          if [ -n "${SOURCE_SHA:-}" ]; then
            git -C "${SERVICE_ROOT}" fetch origin "${SOURCE_SHA}"
            git -C "${SERVICE_ROOT}" checkout "${SOURCE_SHA}"
          fi

          git -C "${FE_ROOT}" fetch origin master
          git -C "${FE_ROOT}" checkout master
          git -C "${FE_ROOT}" pull --ff-only origin master

          restore_env_file "${CORPUS_ENV_BACKUP}" "${CORPUS_ROOT}/.env"
          restore_env_file "${FE_ENV_BACKUP}" "${FE_ROOT}/.env"
          restore_env_file "${SERVICE_ENV_BACKUP}" "${SERVICE_ROOT}/.env"

          [ -f "${CORPUS_ROOT}/Dockerfile" ] || {
            echo "::error::AugustineCorpus/Dockerfile is missing on the server."
            exit 1
          }
          [ -f "${CORPUS_ROOT}/.env" ] || {
            echo "::error::AugustineCorpus/.env is missing on the server."
            exit 1
          }
          [ -f "${FE_ROOT}/.env" ] || {
            echo "::error::AugustineFE/.env is missing on the server."
            exit 1
          }

          cd "${FORTRESS_ROOT}"

          bash scripts/verify-pericope-deploy-lock.sh

          docker compose -p "${COMPOSE_PROJECT}" -f docker-compose.pericope.yml up -d --build augustine-corpus-live \
            >/tmp/pericope-corpus-build.log 2>&1
          tail -n 20 /tmp/pericope-corpus-build.log
          for author in \
            polycarp_of_smyrna \
            gregory_of_nyssa \
            tertullian \
            cyprian_of_carthage \
            boethius \
            anselm_of_canterbury \
            epictetus \
            seneca \
            musonius_rufus \
            machiavelli \
            hermes_trismegistus \
            athanasius_of_alexandria \
            origen_of_alexandria; do
            log_file="/tmp/pericope-index-${author}.log"
            docker compose -p "${COMPOSE_PROJECT}" -f docker-compose.pericope.yml --profile index run --rm \
              pericopeai-indexer python preprocess_and_index.py --author "${author}" --index-dir "/app/indexes/${author}" \
              >"${log_file}" 2>&1
            grep -E 'Loaded |Saving index|Index built' "${log_file}" || tail -n 20 "${log_file}"
          done

          SKIP_GIT_SYNC=true SKIP_PUBLIC_SMOKE=true bash scripts/deploy-pericopeai-prod.sh \
            >/tmp/pericope-api-deploy.log 2>&1
          tail -n 80 /tmp/pericope-api-deploy.log
          docker compose --env-file "${FE_ROOT}/.env" -p "${COMPOSE_PROJECT}" -f docker-compose.pericope.yml up -d --build pericopeai-frontend \
            >/tmp/pericope-frontend-build.log 2>&1
          tail -n 20 /tmp/pericope-frontend-build.log
          docker compose -p "${COMPOSE_PROJECT}" -f docker-compose.pericope.yml ps augustine-corpus-live pericopeai-api pericopeai-frontend

          for url in \
            http://127.0.0.1:18000/api/healthz \
            http://127.0.0.1:18000/api/v1/services/augustine.en/version \
            http://127.0.0.1:18000/api/v1/services/augustine.en/versions; do
            for _ in $(seq 1 20); do
              if curl -fsS "$url" >/dev/null 2>&1; then
                break
              fi
              sleep 2
            done
            curl -fsS "$url" >/dev/null
          done
          python3 scripts/verify-pericope-author-profiles.py \
            --base-url http://127.0.0.1:18000 \
            --assets-base-url http://127.0.0.1:13080 \
            --required-slugs "${REQUIRED_PUBLIC_AUTHOR_SLUGS}" \
            --require-books-for augustine,cyprian_of_carthage,boethius,anselm_of_canterbury
          for url in \
            http://127.0.0.1:13080/ \
            http://127.0.0.1:13080/asset-manifest.json; do
            for _ in $(seq 1 20); do
              if curl -fsS "$url" >/dev/null 2>&1; then
                break
              fi
              sleep 2
            done
            curl -fsS "$url" >/dev/null
          done
          if command -v sudo >/dev/null 2>&1; then
            sudo -n true >/dev/null
          fi
          bash scripts/update-nginx-pericopeai.sh
          python3 - <<'PY'
          import json
          import urllib.error
          import urllib.request

          slugs = ["polycarp_of_smyrna", "gregory_of_nyssa", "tertullian", "cyprian_of_carthage", "boethius", "anselm_of_canterbury"]
          probes = [
              ("container-api", "http://127.0.0.1:18000/api/v1/authors"),
              ("legacy-api", "http://127.0.0.1:8000/api/v1/authors"),
              ("public-api", "https://pericopeai.com/api/v1/authors"),
          ]

          for label, url in probes:
              try:
                  with urllib.request.urlopen(url, timeout=20) as response:
                      payload = json.load(response)
                  visible = {item.get("slug") for item in payload if isinstance(item, dict)}
                  print(label, {slug: (slug in visible) for slug in slugs}, "count", len(visible))
              except Exception as exc:
                  print(label, "error", repr(exc))

          for label, url in [
              ("container-fe-portrait", "http://127.0.0.1:13080/media/authors/polycarp_of_smyrna.jpg"),
              ("public-portrait", "https://pericopeai.com/media/authors/polycarp_of_smyrna.jpg"),
          ]:
              try:
                  with urllib.request.urlopen(url, timeout=20) as response:
                      print(label, response.status, response.headers.get("content-type"), response.headers.get("last-modified"))
              except urllib.error.HTTPError as exc:
                  print(label, exc.code, exc.headers.get("content-type"), "HTTPError")
              except Exception as exc:
                  print(label, "error", repr(exc))
          PY
          REMOTE

      - name: Public Smoke
        shell: bash
        run: |
          set -euo pipefail
          for url in \
            https://pericopeai.com/api/v1/services/augustine.en/version \
            https://pericopeai.com/api/v1/services/augustine.en/versions; do
            for _ in $(seq 1 20); do
              if curl -fsS "$url" >/dev/null 2>&1; then
                break
              fi
              sleep 5
            done
            curl -fsS "$url" >/dev/null
          done
          for _ in $(seq 1 12); do
            if python3 scripts/verify-pericope-author-profiles.py \
              --base-url https://pericopeai.com \
              --assets-base-url https://pericopeai.com \
              --required-slugs "${REQUIRED_PUBLIC_AUTHOR_SLUGS}" \
              --require-books-for augustine,cyprian_of_carthage,boethius,anselm_of_canterbury >/dev/null 2>&1 && \
              curl -fsSI https://pericopeai.com/ >/dev/null 2>&1 && \
              curl -fsSI https://pericopeai.com/asset-manifest.json >/dev/null 2>&1; then
              break
            fi
            sleep 10
          done
          python3 scripts/verify-pericope-author-profiles.py \
            --base-url https://pericopeai.com \
            --assets-base-url https://pericopeai.com \
            --required-slugs "${REQUIRED_PUBLIC_AUTHOR_SLUGS}" \
            --require-books-for augustine,cyprian_of_carthage,boethius,anselm_of_canterbury
          for url in \
            https://pericopeai.com/ \
            https://pericopeai.com/asset-manifest.json; do
            curl -fsSI "$url" >/dev/null
          done

      - name: Deployment Summary
        shell: bash
        env:
          INPUT_SERVICE_REF: ${{ github.event.inputs.service_ref }}
          INPUT_SOURCE_SHA: ${{ github.event.inputs.source_sha }}
        run: |
          set -euo pipefail
          SERVICE_REF="${INPUT_SERVICE_REF:-master}"
          SOURCE_SHA="${INPUT_SOURCE_SHA:-latest-on-branch}"
          {
            echo "## Pericope API Deploy"
            echo ""
            echo "- AugustineService ref: \`${SERVICE_REF}\`"
            echo "- AugustineService SHA: \`${SOURCE_SHA}\`"
            echo "- Public API: https://pericopeai.com/api/v1/services/augustine.en/version"
            echo "- Public History: https://pericopeai.com/api/v1/services/augustine.en/versions"
            echo "- Public Augustine profile: https://pericopeai.com/api/v1/authors/augustine/profile"
            echo "- Public Cyprian profile: https://pericopeai.com/api/v1/authors/cyprian_of_carthage/profile"
            echo "- Public Boethius profile: https://pericopeai.com/api/v1/authors/boethius/profile"
            echo "- Public Anselm profile: https://pericopeai.com/api/v1/authors/anselm_of_canterbury/profile"
            echo "- Public Machiavelli profile: https://pericopeai.com/api/v1/authors/machiavelli/profile"
          } >> "$GITHUB_STEP_SUMMARY"
