name: Deploy Solomonic Clock

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Commit SHA built by Solomonic Clock CI
        required: true
        type: string
      source_version:
        description: Human-visible source version shown in the footer
        required: false
        default: ""
        type: string
      environment:
        description: Target environment
        required: true
        default: prod
        type: choice
        options:
          - prod
  repository_dispatch:
    types:
      - deploy-solomonic-clock

permissions:
  contents: read

concurrency:
  group: solomonic-clock-${{ github.event_name == 'repository_dispatch' && github.event.client_payload.environment || inputs.environment || 'prod' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.environment || inputs.environment || 'prod' }}
    env:
      COMPOSE_PROJECT: fortress-phronesis
      DEPLOY_ENVIRONMENT: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.environment || inputs.environment || 'prod' }}
      SOURCE_SHA: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.source_sha || inputs.source_sha }}
      IMAGE_REF: ghcr.io/benlagrone/solomonic-seals:sha-${{ github.event_name == 'repository_dispatch' && github.event.client_payload.source_sha || inputs.source_sha }}
      SOURCE_VERSION: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.source_version || inputs.source_version || '' }}
    steps:
      - name: Resolve Trigger Inputs
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${SOURCE_SHA:-}" ]; then
            echo "source_sha is required" >&2
            exit 1
          fi

          {
            echo "source_sha=${SOURCE_SHA}"
            echo "deploy_environment=${DEPLOY_ENVIRONMENT}"
            echo "source_version=${SOURCE_VERSION:-}"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout Fortress Repo
        uses: actions/checkout@v4

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.SOLOMONIC_CLOCK_DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.SOLOMONIC_CLOCK_DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy On Server
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.SOLOMONIC_CLOCK_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.SOLOMONIC_CLOCK_DEPLOY_USER }}
          DEPLOY_ROOT: ${{ secrets.SOLOMONIC_CLOCK_DEPLOY_ROOT }}
          GHCR_READ_TOKEN: ${{ secrets.SOLOMONIC_CLOCK_GHCR_READ_TOKEN }}
          SOLOMONIC_VIBEVOICE_API_TOKEN: ${{ secrets.SOLOMONIC_VIBEVOICE_API_TOKEN }}
          FORTRESS_VIBEVOICE_API_TOKEN: ${{ secrets.VIBEVOICE_API_TOKEN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          BILLING_ALLOW_LIVE: ${{ vars.BILLING_ALLOW_LIVE }}
          BILLING_SERVICE_API_KEY: ${{ secrets.BILLING_SERVICE_API_KEY }}
          BILLING_FULFILLMENT_SECRET: ${{ secrets.BILLING_FULFILLMENT_SECRET }}
          BILLING_ALLOWED_RETURN_ORIGINS: ${{ vars.BILLING_ALLOWED_RETURN_ORIGINS }}
          SOLOMONIC_BILLING_ENFORCEMENT: ${{ vars.SOLOMONIC_BILLING_ENFORCEMENT }}
        run: |
          set -euo pipefail
          RELEASED_AT_UTC="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          VOICE_TOKEN="${SOLOMONIC_VIBEVOICE_API_TOKEN:-${FORTRESS_VIBEVOICE_API_TOKEN:-}}"

          ssh -i ~/.ssh/id_ed25519 "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "SOLOMONIC_CLOCK_IMAGE='${IMAGE_REF}' SOLOMONIC_APP_VERSION='${SOURCE_VERSION}' SOLOMONIC_RELEASE='sha-${SOURCE_SHA}' SOLOMONIC_RELEASED_AT='${RELEASED_AT_UTC}' SOLOMONIC_VIBEVOICE_API_TOKEN='${VOICE_TOKEN}' STRIPE_SECRET_KEY='${STRIPE_SECRET_KEY}' STRIPE_WEBHOOK_SECRET='${STRIPE_WEBHOOK_SECRET}' BILLING_ALLOW_LIVE='${BILLING_ALLOW_LIVE}' BILLING_SERVICE_API_KEY='${BILLING_SERVICE_API_KEY}' BILLING_FULFILLMENT_SECRET='${BILLING_FULFILLMENT_SECRET}' BILLING_ALLOWED_RETURN_ORIGINS='${BILLING_ALLOWED_RETURN_ORIGINS}' SOLOMONIC_BILLING_ENFORCEMENT='${SOLOMONIC_BILLING_ENFORCEMENT}' DEPLOY_ROOT='${DEPLOY_ROOT}' GHCR_READ_TOKEN='${GHCR_READ_TOKEN}' COMPOSE_PROJECT='${COMPOSE_PROJECT}' bash -s" <<'REMOTE'
          set -euo pipefail

          if [ ! -d "${DEPLOY_ROOT}/.git" ]; then
            install -d "$(dirname "${DEPLOY_ROOT}")"
            git clone https://github.com/benlagrone/fortress-phronesis.git "${DEPLOY_ROOT}"
          fi

          git -C "${DEPLOY_ROOT}" fetch origin main
          git -C "${DEPLOY_ROOT}" checkout main
          if ! git -C "${DEPLOY_ROOT}" diff --quiet -- .github/workflows/deploy-solomonic-clock.yml docker-compose.pericope.yml; then
            echo "Stashing tracked deploy-file edits before fast-forwarding Fortress."
            git -C "${DEPLOY_ROOT}" status --short -- .github/workflows/deploy-solomonic-clock.yml docker-compose.pericope.yml
            git -C "${DEPLOY_ROOT}" stash push -m "pre-solomonic-deploy-${SOLOMONIC_RELEASED_AT}" -- .github/workflows/deploy-solomonic-clock.yml docker-compose.pericope.yml
          fi
          git -C "${DEPLOY_ROOT}" pull --ff-only origin main

          if [ -n "${GHCR_READ_TOKEN:-}" ]; then
            echo "${GHCR_READ_TOKEN}" | docker login ghcr.io -u benlagrone --password-stdin
          fi

          cd "${DEPLOY_ROOT}"
          WORKSPACE_ROOT="$(dirname "${DEPLOY_ROOT}")"
          for env_file in \
            "${WORKSPACE_ROOT}/AugustineService/.env" \
            "${WORKSPACE_ROOT}/AugustineCorpus/.env" \
            "${WORKSPACE_ROOT}/AugustineFE/.env"; do
            if [ ! -f "${env_file}" ]; then
              install -d "$(dirname "${env_file}")"
              touch "${env_file}"
            fi
          done

          SOLOMONIC_CLOCK_IMAGE="${SOLOMONIC_CLOCK_IMAGE}" \
            SOLOMONIC_APP_VERSION="${SOLOMONIC_APP_VERSION:-}" \
            SOLOMONIC_RELEASE="${SOLOMONIC_RELEASE:-}" \
            SOLOMONIC_RELEASED_AT="${SOLOMONIC_RELEASED_AT:-}" \
            SOLOMONIC_VIBEVOICE_API_TOKEN="${SOLOMONIC_VIBEVOICE_API_TOKEN:-}" \
            STRIPE_SECRET_KEY="${STRIPE_SECRET_KEY:-}" \
            STRIPE_WEBHOOK_SECRET="${STRIPE_WEBHOOK_SECRET:-}" \
            BILLING_ALLOW_LIVE="${BILLING_ALLOW_LIVE:-false}" \
            BILLING_SERVICE_API_KEY="${BILLING_SERVICE_API_KEY:-}" \
            BILLING_FULFILLMENT_SECRET="${BILLING_FULFILLMENT_SECRET:-}" \
            BILLING_ALLOWED_RETURN_ORIGINS="${BILLING_ALLOWED_RETURN_ORIGINS:-}" \
            SOLOMONIC_BILLING_ENFORCEMENT="${SOLOMONIC_BILLING_ENFORCEMENT:-audit}" \
            docker compose -p "${COMPOSE_PROJECT}" -f docker-compose.pericope.yml pull solomonic-clock

          STRIPE_SECRET_KEY="${STRIPE_SECRET_KEY:-}" \
            STRIPE_WEBHOOK_SECRET="${STRIPE_WEBHOOK_SECRET:-}" \
            BILLING_SERVICE_API_KEY="${BILLING_SERVICE_API_KEY:-}" \
            BILLING_FULFILLMENT_SECRET="${BILLING_FULFILLMENT_SECRET:-}" \
            BILLING_ALLOWED_RETURN_ORIGINS="${BILLING_ALLOWED_RETURN_ORIGINS:-}" \
            docker compose -p "${COMPOSE_PROJECT}" -f docker-compose.pericope.yml build lecrown-billing

          SOLOMONIC_CLOCK_IMAGE="${SOLOMONIC_CLOCK_IMAGE}" \
            SOLOMONIC_APP_VERSION="${SOLOMONIC_APP_VERSION:-}" \
            SOLOMONIC_RELEASE="${SOLOMONIC_RELEASE:-}" \
            SOLOMONIC_RELEASED_AT="${SOLOMONIC_RELEASED_AT:-}" \
            SOLOMONIC_VIBEVOICE_API_TOKEN="${SOLOMONIC_VIBEVOICE_API_TOKEN:-}" \
            STRIPE_SECRET_KEY="${STRIPE_SECRET_KEY:-}" \
            STRIPE_WEBHOOK_SECRET="${STRIPE_WEBHOOK_SECRET:-}" \
            BILLING_ALLOW_LIVE="${BILLING_ALLOW_LIVE:-false}" \
            BILLING_SERVICE_API_KEY="${BILLING_SERVICE_API_KEY:-}" \
            BILLING_FULFILLMENT_SECRET="${BILLING_FULFILLMENT_SECRET:-}" \
            BILLING_ALLOWED_RETURN_ORIGINS="${BILLING_ALLOWED_RETURN_ORIGINS:-}" \
            SOLOMONIC_BILLING_ENFORCEMENT="${SOLOMONIC_BILLING_ENFORCEMENT:-audit}" \
            docker compose -p "${COMPOSE_PROJECT}" -f docker-compose.pericope.yml up -d --no-build lecrown-billing
          docker compose -p "${COMPOSE_PROJECT}" -f docker-compose.pericope.yml ps lecrown-billing
          for attempt in $(seq 1 12); do
            if docker compose -p "${COMPOSE_PROJECT}" -f docker-compose.pericope.yml exec -T lecrown-billing \
              python -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8090/v1/health', timeout=5).read().decode())" </dev/null; then
              break
            fi
            sleep 2
          done
          docker compose -p "${COMPOSE_PROJECT}" -f docker-compose.pericope.yml exec -T lecrown-billing \
            python -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8090/v1/health', timeout=5).read().decode())" </dev/null \
            || { docker compose -p "${COMPOSE_PROJECT}" -f docker-compose.pericope.yml logs --tail=120 lecrown-billing; exit 1; }

          SOLOMONIC_CLOCK_IMAGE="${SOLOMONIC_CLOCK_IMAGE}" \
            SOLOMONIC_APP_VERSION="${SOLOMONIC_APP_VERSION:-}" \
            SOLOMONIC_RELEASE="${SOLOMONIC_RELEASE:-}" \
            SOLOMONIC_RELEASED_AT="${SOLOMONIC_RELEASED_AT:-}" \
            SOLOMONIC_VIBEVOICE_API_TOKEN="${SOLOMONIC_VIBEVOICE_API_TOKEN:-}" \
            STRIPE_SECRET_KEY="${STRIPE_SECRET_KEY:-}" \
            STRIPE_WEBHOOK_SECRET="${STRIPE_WEBHOOK_SECRET:-}" \
            BILLING_ALLOW_LIVE="${BILLING_ALLOW_LIVE:-false}" \
            BILLING_SERVICE_API_KEY="${BILLING_SERVICE_API_KEY:-}" \
            BILLING_FULFILLMENT_SECRET="${BILLING_FULFILLMENT_SECRET:-}" \
            BILLING_ALLOWED_RETURN_ORIGINS="${BILLING_ALLOWED_RETURN_ORIGINS:-}" \
            SOLOMONIC_BILLING_ENFORCEMENT="${SOLOMONIC_BILLING_ENFORCEMENT:-audit}" \
            docker compose -p "${COMPOSE_PROJECT}" -f docker-compose.pericope.yml up -d --no-build solomonic-clock
          docker compose -p "${COMPOSE_PROJECT}" -f docker-compose.pericope.yml ps lecrown-billing solomonic-clock
          docker compose -p "${COMPOSE_PROJECT}" -f docker-compose.pericope.yml exec -T solomonic-clock \
            python -c "import socket, urllib.request; print(socket.getaddrinfo('lecrown-billing', 8090)[0]); print(urllib.request.urlopen('http://lecrown-billing:8090/v1/health', timeout=5).read().decode())" </dev/null \
            || docker compose -p "${COMPOSE_PROJECT}" -f docker-compose.pericope.yml logs --tail=80 lecrown-billing

          for url in http://127.0.0.1:8086/api/clock http://127.0.0.1:8086/ http://127.0.0.1:8086/api/billing/entitlement http://127.0.0.1:8086/api/billing/catalog; do
            for attempt in $(seq 1 20); do
              if curl -fsS "$url" >/dev/null 2>&1; then
                break
              fi
              sleep 2
            done
            curl -fsS "$url" >/dev/null
          done
          REMOTE

      - name: Public Smoke
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.SOLOMONIC_CLOCK_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.SOLOMONIC_CLOCK_DEPLOY_USER }}
          DEPLOY_ROOT: ${{ secrets.SOLOMONIC_CLOCK_DEPLOY_ROOT || '/root/workspace/fortress-phronesis' }}
        run: |
          set -euo pipefail
          public_urls=(
            https://truevineos.cloud/
            https://truevineos.cloud/api/clock
            https://truevineos.cloud/api/billing/entitlement
            https://truevineos.cloud/api/billing/catalog
          )
          for url in "${public_urls[@]}"; do
            ok=false
            for attempt in $(seq 1 12); do
              if curl -fsS "$url" >/dev/null; then
                ok=true
                break
              fi
              sleep 5
            done
            if [ "$ok" != true ]; then
              echo "::error::Public smoke failed for ${url}"
              ssh -i ~/.ssh/id_ed25519 "${DEPLOY_USER}@${DEPLOY_HOST}" \
                "set -euo pipefail; cd '${DEPLOY_ROOT}'; docker compose -p '${COMPOSE_PROJECT}' -f docker-compose.pericope.yml ps lecrown-billing solomonic-clock; curl -i http://127.0.0.1:8086/api/clock | head -40 || true; curl -i http://127.0.0.1:8086/api/billing/catalog | head -80 || true; docker compose -p '${COMPOSE_PROJECT}' -f docker-compose.pericope.yml logs --tail=120 solomonic-clock; docker compose -p '${COMPOSE_PROJECT}' -f docker-compose.pericope.yml logs --tail=80 lecrown-billing"
              exit 1
            fi
          done

      - name: Deployment Summary
        shell: bash
        run: |
          {
            echo "## Solomonic Clock Deploy"
            echo ""
            echo "- Environment: \`${{ steps.resolve.outputs.deploy_environment }}\`"
            echo "- Source SHA: \`${{ steps.resolve.outputs.source_sha }}\`"
            echo "- Source version: \`${{ steps.resolve.outputs.source_version || 'not provided' }}\`"
            echo "- Release label: \`sha-${{ steps.resolve.outputs.source_sha }}\`"
            echo "- Trigger: \`${{ github.event_name }}\`"
            echo "- Image: \`${IMAGE_REF}\`"
            echo "- Public URL: https://truevineos.cloud/"
          } >> "$GITHUB_STEP_SUMMARY"
