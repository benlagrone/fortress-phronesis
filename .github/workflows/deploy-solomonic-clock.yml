name: Deploy Solomonic Clock

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Commit SHA built by Solomonic Clock CI
        required: true
        type: string
      source_version:
        description: Human-visible source version shown in the footer
        required: false
        default: ""
        type: string
      environment:
        description: Target environment
        required: true
        default: prod
        type: choice
        options:
          - prod

permissions:
  contents: read

concurrency:
  group: solomonic-clock-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      COMPOSE_PROJECT: fortress-phronesis
      IMAGE_REF: ghcr.io/benlagrone/solomonic-seals:sha-${{ inputs.source_sha }}
      SOURCE_VERSION: ${{ inputs.source_version }}
    steps:
      - name: Checkout Fortress Repo
        uses: actions/checkout@v4

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.SOLOMONIC_CLOCK_DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.SOLOMONIC_CLOCK_DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy On Server
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.SOLOMONIC_CLOCK_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.SOLOMONIC_CLOCK_DEPLOY_USER }}
          DEPLOY_ROOT: ${{ secrets.SOLOMONIC_CLOCK_DEPLOY_ROOT }}
          GHCR_READ_TOKEN: ${{ secrets.SOLOMONIC_CLOCK_GHCR_READ_TOKEN }}
        run: |
          set -euo pipefail
          RELEASED_AT_UTC="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          ssh -i ~/.ssh/id_ed25519 "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "SOLOMONIC_CLOCK_IMAGE='${IMAGE_REF}' SOLOMONIC_APP_VERSION='${SOURCE_VERSION}' SOLOMONIC_RELEASE='sha-${{ inputs.source_sha }}' SOLOMONIC_RELEASED_AT='${RELEASED_AT_UTC}' DEPLOY_ROOT='${DEPLOY_ROOT}' GHCR_READ_TOKEN='${GHCR_READ_TOKEN}' COMPOSE_PROJECT='${COMPOSE_PROJECT}' bash -s" <<'REMOTE'
          set -euo pipefail

          if [ ! -d "${DEPLOY_ROOT}/.git" ]; then
            install -d "$(dirname "${DEPLOY_ROOT}")"
            git clone https://github.com/benlagrone/fortress-phronesis.git "${DEPLOY_ROOT}"
          fi

          git -C "${DEPLOY_ROOT}" fetch origin main
          git -C "${DEPLOY_ROOT}" checkout main
          git -C "${DEPLOY_ROOT}" pull --ff-only origin main

          if [ -n "${GHCR_READ_TOKEN:-}" ]; then
            echo "${GHCR_READ_TOKEN}" | docker login ghcr.io -u benlagrone --password-stdin
          fi

          cd "${DEPLOY_ROOT}"

          SOLOMONIC_CLOCK_IMAGE="${SOLOMONIC_CLOCK_IMAGE}" \
            SOLOMONIC_APP_VERSION="${SOLOMONIC_APP_VERSION:-}" \
            SOLOMONIC_RELEASE="${SOLOMONIC_RELEASE:-}" \
            SOLOMONIC_RELEASED_AT="${SOLOMONIC_RELEASED_AT:-}" \
            docker compose -p "${COMPOSE_PROJECT}" -f docker-compose.pericope.yml pull solomonic-clock
          SOLOMONIC_CLOCK_IMAGE="${SOLOMONIC_CLOCK_IMAGE}" \
            SOLOMONIC_APP_VERSION="${SOLOMONIC_APP_VERSION:-}" \
            SOLOMONIC_RELEASE="${SOLOMONIC_RELEASE:-}" \
            SOLOMONIC_RELEASED_AT="${SOLOMONIC_RELEASED_AT:-}" \
            docker compose -p "${COMPOSE_PROJECT}" -f docker-compose.pericope.yml up -d solomonic-clock
          docker compose -p "${COMPOSE_PROJECT}" -f docker-compose.pericope.yml ps solomonic-clock

          for url in http://127.0.0.1:8086/api/clock http://127.0.0.1:8086/; do
            for attempt in $(seq 1 20); do
              if curl -fsS "$url" >/dev/null 2>&1; then
                break
              fi
              sleep 2
            done
            curl -fsS "$url" >/dev/null
          done
          REMOTE

      - name: Public Smoke
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSI https://truevineos.cloud/ >/dev/null
          curl -fsS https://truevineos.cloud/api/clock >/dev/null

      - name: Deployment Summary
        shell: bash
        run: |
          {
            echo "## Solomonic Clock Deploy"
            echo ""
            echo "- Environment: \`${{ inputs.environment }}\`"
            echo "- Source SHA: \`${{ inputs.source_sha }}\`"
            echo "- Source version: \`${{ inputs.source_version || 'not provided' }}\`"
            echo "- Release label: \`sha-${{ inputs.source_sha }}\`"
            echo "- Image: \`${IMAGE_REF}\`"
            echo "- Public URL: https://truevineos.cloud/"
          } >> "$GITHUB_STEP_SUMMARY"
