name: Deploy Pericope Corpus

on:
  workflow_dispatch:
    inputs:
      corpus_ref:
        description: AugustineCorpus branch to deploy
        required: true
        default: master
        type: string
      source_sha:
        description: Optional AugustineCorpus commit SHA to deploy
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: pericope-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    env:
      COMPOSE_PROJECT: fortress-phronesis
    steps:
      - name: Checkout Fortress Repo
        uses: actions/checkout@v4

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.SOLOMONIC_CLOCK_DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.SOLOMONIC_CLOCK_DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy On Server
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.SOLOMONIC_CLOCK_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.SOLOMONIC_CLOCK_DEPLOY_USER }}
          DEPLOY_ROOT: ${{ secrets.SOLOMONIC_CLOCK_DEPLOY_ROOT }}
          INPUT_CORPUS_REF: ${{ github.event.inputs.corpus_ref }}
          INPUT_SOURCE_SHA: ${{ github.event.inputs.source_sha }}
        run: |
          set -euo pipefail

          CORPUS_REF="${INPUT_CORPUS_REF:-master}"
          SOURCE_SHA="${INPUT_SOURCE_SHA:-}"

          ssh -i ~/.ssh/id_ed25519 "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "DEPLOY_ROOT='${DEPLOY_ROOT}' CORPUS_REF='${CORPUS_REF}' SOURCE_SHA='${SOURCE_SHA}' COMPOSE_PROJECT='${COMPOSE_PROJECT}' bash -s" <<'REMOTE'
          set -euo pipefail

          FORTRESS_REPO_URL="https://github.com/benlagrone/fortress-phronesis.git"
          CORPUS_REPO_URL="https://github.com/benlagrone/AugustineCorpus.git"
          FORTRESS_ROOT="${DEPLOY_ROOT}"
          WORKSPACE_ROOT="$(dirname "${DEPLOY_ROOT}")"
          CORPUS_ROOT="${WORKSPACE_ROOT}/AugustineCorpus"
          FE_ROOT="${WORKSPACE_ROOT}/AugustineFE"

          install -d "${WORKSPACE_ROOT}"

          if [ ! -d "${FORTRESS_ROOT}/.git" ]; then
            install -d "$(dirname "${FORTRESS_ROOT}")"
            git clone "${FORTRESS_REPO_URL}" "${FORTRESS_ROOT}"
          fi

          if [ ! -d "${CORPUS_ROOT}/.git" ]; then
            git clone "${CORPUS_REPO_URL}" "${CORPUS_ROOT}"
          fi

          git -C "${FORTRESS_ROOT}" fetch origin main
          git -C "${FORTRESS_ROOT}" checkout main
          git -C "${FORTRESS_ROOT}" pull --ff-only origin main

          git -C "${CORPUS_ROOT}" fetch origin "${CORPUS_REF}"
          git -C "${CORPUS_ROOT}" checkout "${CORPUS_REF}"

          if ! git -C "${CORPUS_ROOT}" diff --quiet || ! git -C "${CORPUS_ROOT}" diff --cached --quiet; then
            stash_label="pericope-corpus-predeploy-${SOURCE_SHA:-${CORPUS_REF}}-$(date -u +%Y%m%dT%H%M%SZ)"
            git -C "${CORPUS_ROOT}" stash push --message "${stash_label}" >/dev/null
            echo "Stashed tracked AugustineCorpus changes as ${stash_label}."
          fi

          git -C "${CORPUS_ROOT}" pull --ff-only origin "${CORPUS_REF}"

          if [ -n "${SOURCE_SHA:-}" ]; then
            git -C "${CORPUS_ROOT}" checkout "${SOURCE_SHA}"
          fi

          [ -f "${CORPUS_ROOT}/.env" ] || {
            echo "::error::AugustineCorpus/.env is missing on the server."
            exit 1
          }

          cd "${FORTRESS_ROOT}"

          bash scripts/verify-pericope-deploy-lock.sh

          docker compose -p "${COMPOSE_PROJECT}" -f docker-compose.pericope.yml up -d --build augustine-corpus-live pericopeai-api
          docker compose -p "${COMPOSE_PROJECT}" -f docker-compose.pericope.yml ps augustine-corpus-live pericopeai-api

          docker compose -p "${COMPOSE_PROJECT}" -f docker-compose.pericope.yml exec -T augustine-corpus-live \
            python -c "import os; key=(os.getenv('OPENAI_API_KEY') or '').strip(); assert key, 'OPENAI_API_KEY missing'; print('openai-key-present')"

          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18000/api/healthz >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:18000/api/healthz >/dev/null

          docker compose -p "${COMPOSE_PROJECT}" -f docker-compose.pericope.yml exec -T augustine-corpus-live \
            python - <<'PY'
          import json
          import urllib.request

          with urllib.request.urlopen("http://127.0.0.1:8001/healthz", timeout=5) as response:
              if response.status != 200:
                  raise SystemExit("corpus health check failed")

          payload = json.dumps(
              {
                  "prompt": "Answer in one short sentence.",
                  "context": "Relevant passages from my works:\\n\\nEcclesiastes 3 reflects on labor and season.",
                  "mode": "conversation",
                  "persona": "solomon",
                  "max_tokens": 80,
              }
          ).encode("utf-8")
          request = urllib.request.Request(
              "http://127.0.0.1:8001/v1/generate",
              data=payload,
              headers={"Content-Type": "application/json"},
          )
          with urllib.request.urlopen(request, timeout=90) as response:
              body = json.load(response)
          completion = str(body.get("completion") or "").strip()
          if not completion:
              raise SystemExit("corpus generate returned empty completion")
          lowered = completion.lower()
          if "api_key client option must be set" in lowered or "openai_api_key" in lowered:
              raise SystemExit(f"corpus generate still missing llm key: {completion}")
          print("generate-smoke-ok")
          PY

          if [ -f "${FE_ROOT}/.env" ]; then
            FE_KEY="$(grep -m1 '^REACT_APP_AUGUSTINE_API_KEY=' "${FE_ROOT}/.env" | cut -d= -f2-)"
            if [ -n "${FE_KEY:-}" ]; then
              CHAT_PAYLOAD='{"question":"why do we work so hard?","mode":"conversation","persona":"solomon"}'
              CHAT_RESPONSE="$(curl -fsS http://127.0.0.1:18000/api/v2/chat \
                -H "Content-Type: application/json" \
                -H "x-api-key: ${FE_KEY}" \
                -d "${CHAT_PAYLOAD}")"
              CHAT_RESPONSE="${CHAT_RESPONSE}" python - <<'PY'
          import json
          import os

          payload = json.loads(os.environ["CHAT_RESPONSE"])
          segments = payload.get("segments") or []
          answer = ""
          for segment in segments:
              if segment.get("type") == "answer":
                  answer = str((segment.get("payload") or {}).get("answer") or "")
                  break
          if not answer:
              answer = str(payload.get("response") or "")
          lowered = answer.lower()
          if "api_key client option must be set" in lowered or "openai_api_key" in lowered:
              raise SystemExit(f"public-chat-smoke failed: {answer}")
          print("chat-smoke-ok")
          PY
            fi
          fi
          REMOTE

      - name: Public Smoke
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS https://pericopeai.com/api/healthz >/dev/null

      - name: Deployment Summary
        shell: bash
        env:
          INPUT_CORPUS_REF: ${{ github.event.inputs.corpus_ref }}
          INPUT_SOURCE_SHA: ${{ github.event.inputs.source_sha }}
        run: |
          set -euo pipefail
          CORPUS_REF="${INPUT_CORPUS_REF:-master}"
          SOURCE_SHA="${INPUT_SOURCE_SHA:-latest-on-branch}"
          {
            echo "## Pericope Corpus Deploy"
            echo ""
            echo "- AugustineCorpus ref: \`${CORPUS_REF}\`"
            echo "- AugustineCorpus SHA: \`${SOURCE_SHA}\`"
            echo "- Public API health: https://pericopeai.com/api/healthz"
          } >> "$GITHUB_STEP_SUMMARY"
