name: Deploy Pericope Corpus

on:
  workflow_dispatch:
    inputs:
      corpus_ref:
        description: AugustineCorpus branch to deploy
        required: true
        default: master
        type: string
      source_sha:
        description: Optional AugustineCorpus commit SHA to deploy
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: pericope-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    env:
      COMPOSE_PROJECT: fortress-phronesis
    steps:
      - name: Checkout Fortress Repo
        uses: actions/checkout@v4

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.SOLOMONIC_CLOCK_DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.SOLOMONIC_CLOCK_DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy On Server
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.SOLOMONIC_CLOCK_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.SOLOMONIC_CLOCK_DEPLOY_USER }}
          DEPLOY_ROOT: ${{ secrets.SOLOMONIC_CLOCK_DEPLOY_ROOT }}
          CORPUS_OPENAI_API_KEY_PRIMARY: ${{ secrets.PERICOPE_CORPUS_OPENAI_API_KEY }}
          CORPUS_OPENAI_API_KEY_FALLBACK: ${{ secrets.JESTER_OPENAI_API_KEY }}
          INPUT_CORPUS_REF: ${{ github.event.inputs.corpus_ref }}
          INPUT_SOURCE_SHA: ${{ github.event.inputs.source_sha }}
        run: |
          set -euo pipefail

          CORPUS_REF="${INPUT_CORPUS_REF:-master}"
          SOURCE_SHA="${INPUT_SOURCE_SHA:-}"
          PRIMARY_KEY="${CORPUS_OPENAI_API_KEY_PRIMARY:-}"
          FALLBACK_KEY="${CORPUS_OPENAI_API_KEY_FALLBACK:-}"
          [ -n "${PRIMARY_KEY}${FALLBACK_KEY}" ] || {
            echo "::error::No corpus OpenAI key secret is configured."
            exit 1
          }

          ssh -i ~/.ssh/id_ed25519 "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "DEPLOY_ROOT='${DEPLOY_ROOT}' CORPUS_REF='${CORPUS_REF}' SOURCE_SHA='${SOURCE_SHA}' COMPOSE_PROJECT='${COMPOSE_PROJECT}' CORPUS_OPENAI_API_KEY_PRIMARY='${PRIMARY_KEY}' CORPUS_OPENAI_API_KEY_FALLBACK='${FALLBACK_KEY}' bash -s" <<'REMOTE'
          set -euo pipefail

          FORTRESS_REPO_URL="https://github.com/benlagrone/fortress-phronesis.git"
          CORPUS_REPO_URL="https://github.com/benlagrone/AugustineCorpus.git"
          FORTRESS_ROOT="${DEPLOY_ROOT}"
          WORKSPACE_ROOT="$(dirname "${DEPLOY_ROOT}")"
          CORPUS_ROOT="${WORKSPACE_ROOT}/AugustineCorpus"
          FE_ROOT="${WORKSPACE_ROOT}/AugustineFE"
          CORPUS_COMPOSE_OVERRIDE="$(mktemp "${TMPDIR:-/tmp}/pericope-corpus-override.XXXXXX.yml")"

          trap 'rm -f "${CORPUS_COMPOSE_OVERRIDE}"' EXIT

          install -d "${WORKSPACE_ROOT}"

          if [ ! -d "${FORTRESS_ROOT}/.git" ]; then
            install -d "$(dirname "${FORTRESS_ROOT}")"
            git clone "${FORTRESS_REPO_URL}" "${FORTRESS_ROOT}"
          fi

          if [ ! -d "${CORPUS_ROOT}" ]; then
            backup_root="$(ls -1dt "${CORPUS_ROOT}.pre-git-"* 2>/dev/null | head -n 1 || true)"
            if [ -n "${backup_root:-}" ]; then
              mv "${backup_root}" "${CORPUS_ROOT}"
            fi
          fi

          if [ ! -d "${CORPUS_ROOT}" ]; then
            echo "::error::AugustineCorpus workspace is missing on the server."
            exit 1
          fi

          git -C "${FORTRESS_ROOT}" fetch origin main
          git -C "${FORTRESS_ROOT}" checkout main
          git -C "${FORTRESS_ROOT}" merge --ff-only FETCH_HEAD

          if [ -d "${CORPUS_ROOT}/.git" ]; then
            git -C "${CORPUS_ROOT}" fetch origin "${CORPUS_REF}"
            git -C "${CORPUS_ROOT}" checkout "${CORPUS_REF}"

            if ! git -C "${CORPUS_ROOT}" diff --quiet || ! git -C "${CORPUS_ROOT}" diff --cached --quiet; then
              stash_label="pericope-corpus-predeploy-${SOURCE_SHA:-${CORPUS_REF}}-$(date -u +%Y%m%dT%H%M%SZ)"
              git -C "${CORPUS_ROOT}" stash push --message "${stash_label}" >/dev/null
              echo "Stashed tracked AugustineCorpus changes as ${stash_label}."
            fi

            git -C "${CORPUS_ROOT}" merge --ff-only FETCH_HEAD

            if [ -n "${SOURCE_SHA:-}" ]; then
              git -C "${CORPUS_ROOT}" checkout "${SOURCE_SHA}"
            fi
          else
            echo "Using existing non-git AugustineCorpus workspace."
            if [ -n "${SOURCE_SHA:-}" ]; then
              echo "::error::Cannot target a specific source SHA without a git checkout."
              exit 1
            fi
          fi

          [ -f "${CORPUS_ROOT}/.env" ] || {
            echo "::error::AugustineCorpus/.env is missing on the server."
            exit 1
          }

          extract_key_from_file() {
            local env_path="${1:-}"
            [ -f "${env_path}" ] || return 0
            ENV_PATH="${env_path}" python3 - <<'PY'
          import os
          from pathlib import Path

          env_path = Path(os.environ["ENV_PATH"])
          for line in env_path.read_text(encoding="utf-8").splitlines():
              if line.startswith("OPENAI_API_KEY="):
                  print(line.split("=", 1)[1].strip())
                  break
          PY
          }

          append_candidate() {
            local candidate_label="${1:-}"
            local candidate_key="${2:-}"
            if [ -z "${candidate_key}" ]; then
              return 0
            fi
            if [ -n "${seen_candidate_keys["${candidate_key}"]+x}" ]; then
              return 0
            fi
            seen_candidate_keys["${candidate_key}"]=1
            candidate_labels+=("${candidate_label}")
            candidate_keys+=("${candidate_key}")
          }

          write_corpus_key() {
            local candidate_key="${1:-}"
            [ -n "${candidate_key}" ] || {
              echo "::error::Candidate corpus key is empty."
              return 1
            }
            CORPUS_COMPOSE_OVERRIDE="${CORPUS_COMPOSE_OVERRIDE}" CORPUS_OPENAI_API_KEY_CANDIDATE="${candidate_key}" python3 - <<'PY'
          import os
          key = os.environ.get("CORPUS_OPENAI_API_KEY_CANDIDATE", "").strip()
          output_path = os.environ["CORPUS_COMPOSE_OVERRIDE"]
          if not key:
              raise SystemExit("CORPUS_OPENAI_API_KEY_CANDIDATE is empty")
          escaped = key.replace("\\", "\\\\").replace('"', '\\"')
          payload = (
              "services:\\n"
              "  augustine-corpus-live:\\n"
              "    environment:\\n"
              f'      OPENAI_API_KEY: "{escaped}"\\n'
          )
          with open(output_path, "w", encoding="utf-8") as handle:
              handle.write(payload)
          print("corpus-compose-override-written")
          PY
          }

          wait_api_health() {
            for _ in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:18000/api/healthz >/dev/null 2>&1; then
                return 0
              fi
              sleep 2
            done
            curl -fsS http://127.0.0.1:18000/api/healthz >/dev/null
          }

          wait_corpus_health() {
            for _ in $(seq 1 30); do
              if docker compose -p "${COMPOSE_PROJECT}" -f docker-compose.pericope.yml exec -T augustine-corpus-live \
                python - <<'PY' >/dev/null 2>&1
          import urllib.request

          with urllib.request.urlopen("http://127.0.0.1:8001/healthz", timeout=5) as response:
              if response.status != 200:
                  raise SystemExit(1)
          PY
              then
                return 0
              fi
              sleep 2
            done

            docker compose -p "${COMPOSE_PROJECT}" -f docker-compose.pericope.yml exec -T augustine-corpus-live \
              python - <<'PY'
          import urllib.request

          with urllib.request.urlopen("http://127.0.0.1:8001/healthz", timeout=5) as response:
              if response.status != 200:
                  raise SystemExit(1)
          print("corpus-health-ok")
          PY
          }

          run_internal_generate_smoke() {
            docker compose -p "${COMPOSE_PROJECT}" -f docker-compose.pericope.yml exec -T augustine-corpus-live \
              python - <<'PY'
          import json
          import urllib.request

          with urllib.request.urlopen("http://127.0.0.1:8001/healthz", timeout=5) as response:
              if response.status != 200:
                  raise SystemExit("corpus health check failed")

          payload = json.dumps(
              {
                  "prompt": "Answer in one short sentence.",
                  "context": "Relevant passages from my works:\\n\\nEcclesiastes 3 reflects on labor and season.",
                  "mode": "conversation",
                  "persona": "solomon",
                  "max_tokens": 80,
              }
          ).encode("utf-8")
          request = urllib.request.Request(
              "http://127.0.0.1:8001/v1/generate",
              data=payload,
              headers={"Content-Type": "application/json"},
          )
          with urllib.request.urlopen(request, timeout=90) as response:
              body = json.load(response)
          completion = str(body.get("completion") or "").strip()
          if not completion:
              raise SystemExit("corpus generate returned empty completion")
          lowered = completion.lower()
          if (
              "api_key client option must be set" in lowered
              or "openai_api_key" in lowered
              or "incorrect api key" in lowered
              or "error with openai api" in lowered
          ):
              raise SystemExit(f"corpus generate still failing llm auth: {completion}")
          print("generate-smoke-ok")
          PY
          }

          run_internal_chat_smoke() {
            if [ -z "${FE_KEY:-}" ]; then
              return 0
            fi

            CHAT_PAYLOAD='{"question":"why do we work so hard?","mode":"conversation","persona":"solomon"}'
            CHAT_RESPONSE="$(curl -fsS http://127.0.0.1:18000/api/v2/chat \
              -H "Content-Type: application/json" \
              -H "x-api-key: ${FE_KEY}" \
              -d "${CHAT_PAYLOAD}")"
            CHAT_RESPONSE="${CHAT_RESPONSE}" python3 - <<'PY'
          import json
          import os

          payload = json.loads(os.environ["CHAT_RESPONSE"])
          segments = payload.get("segments") or []
          answer = ""
          for segment in segments:
              if segment.get("type") == "answer":
                  answer = str((segment.get("payload") or {}).get("answer") or "")
                  break
          if not answer:
              answer = str(payload.get("response") or "")
          lowered = answer.lower()
          if (
              "api_key client option must be set" in lowered
              or "openai_api_key" in lowered
              or "incorrect api key" in lowered
              or "error with openai api" in lowered
          ):
              raise SystemExit(f"public-chat-smoke failed: {answer}")
          print("chat-smoke-ok")
          PY
          }

          run_public_chat_smoke() {
            if [ -z "${FE_KEY:-}" ]; then
              return 0
            fi

            CHAT_PAYLOAD='{"question":"why do we work so hard?","mode":"conversation","persona":"solomon"}'
            CHAT_RESPONSE="$(curl -fsS https://pericopeai.com/api/v2/chat \
              -H "Content-Type: application/json" \
              -H "x-api-key: ${FE_KEY}" \
              -d "${CHAT_PAYLOAD}")"
            CHAT_RESPONSE="${CHAT_RESPONSE}" python3 - <<'PY'
          import json
          import os

          payload = json.loads(os.environ["CHAT_RESPONSE"])
          segments = payload.get("segments") or []
          answer = ""
          for segment in segments:
              if segment.get("type") == "answer":
                  answer = str((segment.get("payload") or {}).get("answer") or "")
                  break
          if not answer:
              answer = str(payload.get("response") or "")
          lowered = answer.lower()
          if (
              "api_key client option must be set" in lowered
              or "openai_api_key" in lowered
              or "incorrect api key" in lowered
              or "error with openai api" in lowered
          ):
              raise SystemExit(f"public-edge-chat-smoke failed: {answer}")
          print("public-chat-smoke-ok")
          PY
          }

          cd "${FORTRESS_ROOT}"

          bash scripts/verify-pericope-deploy-lock.sh

          FE_KEY=""
          if [ -f "${FE_ROOT}/.env" ]; then
            FE_KEY="$(grep -m1 '^REACT_APP_AUGUSTINE_API_KEY=' "${FE_ROOT}/.env" | cut -d= -f2-)"
          fi

          declare -A seen_candidate_keys=()
          candidate_labels=()
          candidate_keys=()
          append_candidate "pericope-secret" "${CORPUS_OPENAI_API_KEY_PRIMARY:-}"
          append_candidate "jester-secret" "${CORPUS_OPENAI_API_KEY_FALLBACK:-}"
          append_candidate "service-env" "$(extract_key_from_file "${WORKSPACE_ROOT}/AugustineService/.env")"
          append_candidate "corpus-env-current" "$(extract_key_from_file "${CORPUS_ROOT}/.env")"
          for backup_root in $(ls -1dt "${CORPUS_ROOT}.pre-git-"* 2>/dev/null || true); do
            append_candidate "corpus-backup:$(basename "${backup_root}")" "$(extract_key_from_file "${backup_root}/.env")"
          done

          validated_label=""
          for idx in "${!candidate_keys[@]}"; do
            candidate_label="${candidate_labels[$idx]}"
            candidate_key="${candidate_keys[$idx]}"
            echo "Trying corpus LLM key source: ${candidate_label}"

            write_corpus_key "${candidate_key}"

            docker compose -p "${COMPOSE_PROJECT}" -f docker-compose.pericope.yml -f "${CORPUS_COMPOSE_OVERRIDE}" up -d --no-build --force-recreate augustine-corpus-live pericopeai-api
            docker compose -p "${COMPOSE_PROJECT}" -f docker-compose.pericope.yml ps augustine-corpus-live pericopeai-api

            docker compose -p "${COMPOSE_PROJECT}" -f docker-compose.pericope.yml exec -T augustine-corpus-live \
              python -c "import os; key=(os.getenv('OPENAI_API_KEY') or '').strip(); assert key, 'OPENAI_API_KEY missing'; print('openai-key-present')"

            wait_corpus_health
            wait_api_health

            if ! run_internal_generate_smoke; then
              echo "Corpus LLM key source failed internal generate smoke: ${candidate_label}"
              continue
            fi

            if ! run_internal_chat_smoke; then
              echo "Corpus LLM key source failed internal chat smoke: ${candidate_label}"
              continue
            fi

            if ! run_public_chat_smoke; then
              echo "Corpus LLM key source failed public chat smoke: ${candidate_label}"
              continue
            fi

            validated_label="${candidate_label}"
            echo "Validated corpus LLM key source: ${validated_label}"
            break
          done

          if [ -z "${validated_label}" ]; then
            echo "::error::No configured corpus OpenAI key source passed validation."
            exit 1
          fi
          REMOTE

      - name: Public Smoke
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 20); do
            if curl -fsS https://pericopeai.com/api/healthz >/dev/null 2>&1; then
              exit 0
            fi
            sleep 3
          done
          curl -fsS https://pericopeai.com/api/healthz >/dev/null

      - name: Deployment Summary
        shell: bash
        env:
          INPUT_CORPUS_REF: ${{ github.event.inputs.corpus_ref }}
          INPUT_SOURCE_SHA: ${{ github.event.inputs.source_sha }}
        run: |
          set -euo pipefail
          CORPUS_REF="${INPUT_CORPUS_REF:-master}"
          SOURCE_SHA="${INPUT_SOURCE_SHA:-latest-on-branch}"
          {
            echo "## Pericope Corpus Deploy"
            echo ""
            echo "- AugustineCorpus ref: \`${CORPUS_REF}\`"
            echo "- AugustineCorpus SHA: \`${SOURCE_SHA}\`"
            echo "- Public API health: https://pericopeai.com/api/healthz"
          } >> "$GITHUB_STEP_SUMMARY"
