name: Deploy LeCrown Properties

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Commit SHA built by LeCrown Properties CI
        required: true
        type: string
      environment:
        description: Target environment
        required: true
        default: prod
        type: choice
        options:
          - prod

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: lecrownproperties-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      COMPOSE_PROJECT: lecrownproperties
      IMAGE_REF: ghcr.io/benlagrone/lecrownproperties-site:sha-${{ inputs.source_sha }}
    steps:
      - name: Checkout Fortress Repo
        uses: actions/checkout@v4

      - name: Resolve Deploy Credentials
        id: resolve_deploy
        shell: bash
        env:
          SHARED_DEPLOY_HOST: ${{ secrets.SOLOMONIC_CLOCK_DEPLOY_HOST != '' && secrets.SOLOMONIC_CLOCK_DEPLOY_HOST || '89.117.151.145' }}
          SHARED_DEPLOY_USER: ${{ secrets.SOLOMONIC_CLOCK_DEPLOY_USER != '' && secrets.SOLOMONIC_CLOCK_DEPLOY_USER || 'root' }}
          SHARED_DEPLOY_SSH_KEY: ${{ secrets.SOLOMONIC_CLOCK_DEPLOY_SSH_KEY }}
          SHARED_DEPLOY_KNOWN_HOSTS: ${{ secrets.SOLOMONIC_CLOCK_DEPLOY_KNOWN_HOSTS }}
          SHARED_GHCR_READ_TOKEN: ${{ secrets.SOLOMONIC_CLOCK_GHCR_READ_TOKEN }}
        run: |
          set -euo pipefail

          DEPLOY_HOST="${SHARED_DEPLOY_HOST:-}"
          DEPLOY_USER="${SHARED_DEPLOY_USER:-}"
          DEPLOY_ROOT="/tmp/fortress-phronesis-lecrown-${GITHUB_RUN_ID}"
          DEPLOY_SSH_KEY="${SHARED_DEPLOY_SSH_KEY:-}"
          DEPLOY_KNOWN_HOSTS="${SHARED_DEPLOY_KNOWN_HOSTS:-}"
          GHCR_READ_TOKEN="${SHARED_GHCR_READ_TOKEN:-}"
          CREDENTIAL_SOURCE="solomonic-clock-shared"

          required=(DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS GHCR_READ_TOKEN)
          missing=()
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              missing+=("${name}")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing LeCrown Properties deploy configuration after fallback: %s\n' "${missing[*]}" >&2
            exit 1
          fi

          {
            echo "DEPLOY_HOST<<EOF"
            echo "${DEPLOY_HOST}"
            echo "EOF"
            echo "DEPLOY_USER<<EOF"
            echo "${DEPLOY_USER}"
            echo "EOF"
            echo "DEPLOY_ROOT<<EOF"
            echo "${DEPLOY_ROOT}"
            echo "EOF"
            echo "DEPLOY_SSH_KEY<<EOF"
            echo "${DEPLOY_SSH_KEY}"
            echo "EOF"
            echo "DEPLOY_KNOWN_HOSTS<<EOF"
            echo "${DEPLOY_KNOWN_HOSTS}"
            echo "EOF"
            echo "GHCR_READ_TOKEN<<EOF"
            echo "${GHCR_READ_TOKEN}"
            echo "EOF"
            echo "REMOTE_SYNC_SCRIPT=/tmp/lecrownproperties-sync-prod-repo-${GITHUB_RUN_ID}.sh"
            echo "REMOTE_ENV_FILE=/tmp/lecrownproperties-gridscope-${GITHUB_RUN_ID}.env"
            echo "HOST_GRIDSCOPE_ENV_FILE=/opt/lecrownproperties/env/gridscope.prod.env"
            echo "UPLOADED_GRIDSCOPE_ENV=false"
          } >> "$GITHUB_ENV"

          echo "credential_source=${CREDENTIAL_SOURCE}" >> "$GITHUB_OUTPUT"

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "${DEPLOY_SSH_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${DEPLOY_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload Sync Script
        shell: bash
        run: |
          set -euo pipefail
          scp -i ~/.ssh/id_ed25519 scripts/sync-prod-repo.sh "${DEPLOY_USER}@${DEPLOY_HOST}:${REMOTE_SYNC_SCRIPT}"

      - name: Upload Runtime Env
        shell: bash
        env:
          GRIDSCOPE_EXTERNAL_API_URL: ${{ secrets.LECROWNPROPERTIES_GRIDSCOPE_EXTERNAL_API_URL }}
          GRIDSCOPE_EXTERNAL_API_KEY: ${{ secrets.LECROWNPROPERTIES_GRIDSCOPE_EXTERNAL_API_KEY }}
          GRIDSCOPE_EXTERNAL_API_AUTH_MODE: ${{ secrets.LECROWNPROPERTIES_GRIDSCOPE_EXTERNAL_API_AUTH_MODE }}
          GRIDSCOPE_EXTERNAL_API_HEADER_NAME: ${{ secrets.LECROWNPROPERTIES_GRIDSCOPE_EXTERNAL_API_HEADER_NAME }}
          GRIDSCOPE_EXTERNAL_API_TIMEOUT_MS: ${{ secrets.LECROWNPROPERTIES_GRIDSCOPE_EXTERNAL_API_TIMEOUT_MS }}
          GRIDSCOPE_EXTERNAL_API_CACHE_TTL_SECONDS: ${{ secrets.LECROWNPROPERTIES_GRIDSCOPE_EXTERNAL_API_CACHE_TTL_SECONDS }}
          KEYCLOAK_BASE_URL: ${{ secrets.LECROWNPROPERTIES_KEYCLOAK_BASE_URL }}
          KEYCLOAK_REALM: ${{ secrets.LECROWNPROPERTIES_KEYCLOAK_REALM }}
          KEYCLOAK_CLIENT_ID: ${{ secrets.LECROWNPROPERTIES_KEYCLOAK_CLIENT_ID }}
          KEYCLOAK_CLIENT_SECRET: ${{ secrets.LECROWNPROPERTIES_KEYCLOAK_CLIENT_SECRET }}
          KEYCLOAK_REDIRECT_URI: ${{ secrets.LECROWNPROPERTIES_KEYCLOAK_REDIRECT_URI }}
          KEYCLOAK_PUBLIC_ORIGIN: ${{ secrets.LECROWNPROPERTIES_KEYCLOAK_PUBLIC_ORIGIN }}
          KEYCLOAK_ALLOWED_ROLES: ${{ secrets.LECROWNPROPERTIES_KEYCLOAK_ALLOWED_ROLES }}
          KEYCLOAK_AUTH_SCOPE: ${{ secrets.LECROWNPROPERTIES_KEYCLOAK_AUTH_SCOPE }}
        run: |
          set -euo pipefail
          if [ -n "${GRIDSCOPE_EXTERNAL_API_URL:-}" ] && [ -n "${GRIDSCOPE_EXTERNAL_API_KEY:-}" ]; then
            LOCAL_ENV_FILE="$(mktemp)"
            {
              printf 'GRIDSCOPE_EXTERNAL_API_URL=%s\n' "${GRIDSCOPE_EXTERNAL_API_URL}"
              printf 'GRIDSCOPE_EXTERNAL_API_KEY=%s\n' "${GRIDSCOPE_EXTERNAL_API_KEY}"
              if [ -n "${GRIDSCOPE_EXTERNAL_API_AUTH_MODE:-}" ]; then
                printf 'GRIDSCOPE_EXTERNAL_API_AUTH_MODE=%s\n' "${GRIDSCOPE_EXTERNAL_API_AUTH_MODE}"
              fi
              if [ -n "${GRIDSCOPE_EXTERNAL_API_HEADER_NAME:-}" ]; then
                printf 'GRIDSCOPE_EXTERNAL_API_HEADER_NAME=%s\n' "${GRIDSCOPE_EXTERNAL_API_HEADER_NAME}"
              fi
              if [ -n "${GRIDSCOPE_EXTERNAL_API_TIMEOUT_MS:-}" ]; then
                printf 'GRIDSCOPE_EXTERNAL_API_TIMEOUT_MS=%s\n' "${GRIDSCOPE_EXTERNAL_API_TIMEOUT_MS}"
              fi
              if [ -n "${GRIDSCOPE_EXTERNAL_API_CACHE_TTL_SECONDS:-}" ]; then
                printf 'GRIDSCOPE_EXTERNAL_API_CACHE_TTL_SECONDS=%s\n' "${GRIDSCOPE_EXTERNAL_API_CACHE_TTL_SECONDS}"
              fi
              if [ -n "${KEYCLOAK_BASE_URL:-}" ]; then
                printf 'KEYCLOAK_BASE_URL=%s\n' "${KEYCLOAK_BASE_URL}"
              fi
              if [ -n "${KEYCLOAK_REALM:-}" ]; then
                printf 'KEYCLOAK_REALM=%s\n' "${KEYCLOAK_REALM}"
              fi
              if [ -n "${KEYCLOAK_CLIENT_ID:-}" ]; then
                printf 'KEYCLOAK_CLIENT_ID=%s\n' "${KEYCLOAK_CLIENT_ID}"
              fi
              if [ -n "${KEYCLOAK_CLIENT_SECRET:-}" ]; then
                printf 'KEYCLOAK_CLIENT_SECRET=%s\n' "${KEYCLOAK_CLIENT_SECRET}"
              fi
              if [ -n "${KEYCLOAK_REDIRECT_URI:-}" ]; then
                printf 'KEYCLOAK_REDIRECT_URI=%s\n' "${KEYCLOAK_REDIRECT_URI}"
              fi
              if [ -n "${KEYCLOAK_PUBLIC_ORIGIN:-}" ]; then
                printf 'KEYCLOAK_PUBLIC_ORIGIN=%s\n' "${KEYCLOAK_PUBLIC_ORIGIN}"
              fi
              if [ -n "${KEYCLOAK_ALLOWED_ROLES:-}" ]; then
                printf 'KEYCLOAK_ALLOWED_ROLES=%s\n' "${KEYCLOAK_ALLOWED_ROLES}"
              fi
              if [ -n "${KEYCLOAK_AUTH_SCOPE:-}" ]; then
                printf 'KEYCLOAK_AUTH_SCOPE=%s\n' "${KEYCLOAK_AUTH_SCOPE}"
              fi
            } > "${LOCAL_ENV_FILE}"
            chmod 600 "${LOCAL_ENV_FILE}"
            scp -i ~/.ssh/id_ed25519 "${LOCAL_ENV_FILE}" "${DEPLOY_USER}@${DEPLOY_HOST}:${REMOTE_ENV_FILE}"
            rm -f "${LOCAL_ENV_FILE}"
            echo "UPLOADED_GRIDSCOPE_ENV=true" >> "$GITHUB_ENV"
          fi

      - name: Remote Connectivity Check
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 "${DEPLOY_USER}@${DEPLOY_HOST}" "echo connected"

      - name: Check Host GridScope Env
        id: check_host_gridscope_env
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 "${DEPLOY_USER}@${DEPLOY_HOST}" "[ -f '${HOST_GRIDSCOPE_ENV_FILE}' ]"

      - name: Require GridScope Runtime
        if: ${{ steps.check_host_gridscope_env.conclusion != 'success' && env.UPLOADED_GRIDSCOPE_ENV != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "GridScope runtime is missing on the host and no workflow secrets were uploaded." >&2
          exit 1

      - name: Remote Sync Fortress Repo
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "chmod 700 '${REMOTE_SYNC_SCRIPT}' && bash '${REMOTE_SYNC_SCRIPT}' '${DEPLOY_ROOT}' 'https://github.com/benlagrone/fortress-phronesis.git' main 'fortress-phronesis'"

      - name: Validate Active GridScope Env
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "HOST_GRIDSCOPE_ENV_FILE='${HOST_GRIDSCOPE_ENV_FILE}' REMOTE_ENV_FILE='${REMOTE_ENV_FILE}' bash -s" <<'REMOTE'
          set -euo pipefail

          ACTIVE_ENV_FILE=""
          if [ -n "${REMOTE_ENV_FILE:-}" ] && [ -f "${REMOTE_ENV_FILE}" ]; then
            ACTIVE_ENV_FILE="${REMOTE_ENV_FILE}"
          elif [ -n "${HOST_GRIDSCOPE_ENV_FILE:-}" ] && [ -f "${HOST_GRIDSCOPE_ENV_FILE}" ]; then
            ACTIVE_ENV_FILE="${HOST_GRIDSCOPE_ENV_FILE}"
          fi

          if [ -z "${ACTIVE_ENV_FILE}" ]; then
            echo "No active GridScope env file found." >&2
            exit 1
          fi

          grep -q '^GRIDSCOPE_EXTERNAL_API_URL=.' "${ACTIVE_ENV_FILE}"
          grep -q '^GRIDSCOPE_EXTERNAL_API_KEY=.' "${ACTIVE_ENV_FILE}"
          REMOTE

      - name: Remote GHCR Login
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "GHCR_READ_TOKEN='${GHCR_READ_TOKEN}' bash -s" <<'REMOTE'
          set -euo pipefail

          if [ -n "${GHCR_READ_TOKEN:-}" ]; then
            echo "${GHCR_READ_TOKEN}" | docker login ghcr.io -u benlagrone --password-stdin
          fi
          REMOTE

      - name: Remote Compose Pull
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "DEPLOY_ROOT='${DEPLOY_ROOT}' COMPOSE_PROJECT='${COMPOSE_PROJECT}' HOST_GRIDSCOPE_ENV_FILE='${HOST_GRIDSCOPE_ENV_FILE}' REMOTE_ENV_FILE='${REMOTE_ENV_FILE}' LECROWNPROPERTIES_IMAGE='${IMAGE_REF}' bash -s" <<'REMOTE'
          set -euo pipefail

          cd "${DEPLOY_ROOT}"

          COMPOSE_CMD=(docker compose -p "${COMPOSE_PROJECT}" -f docker-compose.lecrownproperties.yml)
          ACTIVE_ENV_FILE=""
          if [ -n "${REMOTE_ENV_FILE:-}" ] && [ -f "${REMOTE_ENV_FILE}" ]; then
            ACTIVE_ENV_FILE="${REMOTE_ENV_FILE}"
          elif [ -n "${HOST_GRIDSCOPE_ENV_FILE:-}" ] && [ -f "${HOST_GRIDSCOPE_ENV_FILE}" ]; then
            ACTIVE_ENV_FILE="${HOST_GRIDSCOPE_ENV_FILE}"
          fi
          if [ -n "${ACTIVE_ENV_FILE}" ]; then
            chmod 600 "${ACTIVE_ENV_FILE}"
            COMPOSE_CMD=(docker compose --env-file "${ACTIVE_ENV_FILE}" -p "${COMPOSE_PROJECT}" -f docker-compose.lecrownproperties.yml)
          fi

          LECROWNPROPERTIES_IMAGE="${LECROWNPROPERTIES_IMAGE}" "${COMPOSE_CMD[@]}" pull lecrown-properties-site
          REMOTE

      - name: Remote Compose Up
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "DEPLOY_ROOT='${DEPLOY_ROOT}' COMPOSE_PROJECT='${COMPOSE_PROJECT}' HOST_GRIDSCOPE_ENV_FILE='${HOST_GRIDSCOPE_ENV_FILE}' REMOTE_ENV_FILE='${REMOTE_ENV_FILE}' LECROWNPROPERTIES_IMAGE='${IMAGE_REF}' bash -s" <<'REMOTE'
          set -euo pipefail

          cd "${DEPLOY_ROOT}"

          COMPOSE_CMD=(docker compose -p "${COMPOSE_PROJECT}" -f docker-compose.lecrownproperties.yml)
          ACTIVE_ENV_FILE=""
          if [ -n "${REMOTE_ENV_FILE:-}" ] && [ -f "${REMOTE_ENV_FILE}" ]; then
            ACTIVE_ENV_FILE="${REMOTE_ENV_FILE}"
          elif [ -n "${HOST_GRIDSCOPE_ENV_FILE:-}" ] && [ -f "${HOST_GRIDSCOPE_ENV_FILE}" ]; then
            ACTIVE_ENV_FILE="${HOST_GRIDSCOPE_ENV_FILE}"
          fi
          if [ -n "${ACTIVE_ENV_FILE}" ]; then
            chmod 600 "${ACTIVE_ENV_FILE}"
            COMPOSE_CMD=(docker compose --env-file "${ACTIVE_ENV_FILE}" -p "${COMPOSE_PROJECT}" -f docker-compose.lecrownproperties.yml)
          fi

          LECROWNPROPERTIES_IMAGE="${LECROWNPROPERTIES_IMAGE}" "${COMPOSE_CMD[@]}" up -d lecrown-properties-site
          REMOTE

      - name: Remote Health Smoke
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "bash -s" <<'REMOTE'
          set -euo pipefail

          body=""
          for attempt in $(seq 1 20); do
            body="$(curl -fsS http://127.0.0.1:18033/health 2>/dev/null || true)"
            if printf '%s' "${body}" | grep -q '"gridscope_configured":true'; then
              exit 0
            fi
            sleep 2
          done
          printf '%s\n' "${body}" >&2
          exit 1
          REMOTE

      - name: Remote Home Smoke
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "curl -fsS http://127.0.0.1:18033/ >/dev/null"

      - name: Remote Contact Smoke
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "curl -fsS 'http://127.0.0.1:18033/contact?lang=zh' >/dev/null"

      - name: Remote Site Data Smoke
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "curl -fsS http://127.0.0.1:18033/data/site.en.json >/dev/null"

      - name: Remote Compose Status
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "DEPLOY_ROOT='${DEPLOY_ROOT}' COMPOSE_PROJECT='${COMPOSE_PROJECT}' HOST_GRIDSCOPE_ENV_FILE='${HOST_GRIDSCOPE_ENV_FILE}' REMOTE_ENV_FILE='${REMOTE_ENV_FILE}' bash -s" <<'REMOTE'
          set -euo pipefail

          cd "${DEPLOY_ROOT}"

          COMPOSE_CMD=(docker compose -p "${COMPOSE_PROJECT}" -f docker-compose.lecrownproperties.yml)
          ACTIVE_ENV_FILE=""
          if [ -n "${REMOTE_ENV_FILE:-}" ] && [ -f "${REMOTE_ENV_FILE}" ]; then
            ACTIVE_ENV_FILE="${REMOTE_ENV_FILE}"
          elif [ -n "${HOST_GRIDSCOPE_ENV_FILE:-}" ] && [ -f "${HOST_GRIDSCOPE_ENV_FILE}" ]; then
            ACTIVE_ENV_FILE="${HOST_GRIDSCOPE_ENV_FILE}"
          fi
          if [ -n "${ACTIVE_ENV_FILE}" ]; then
            chmod 600 "${ACTIVE_ENV_FILE}"
            COMPOSE_CMD=(docker compose --env-file "${ACTIVE_ENV_FILE}" -p "${COMPOSE_PROJECT}" -f docker-compose.lecrownproperties.yml)
          fi

          "${COMPOSE_CMD[@]}" ps lecrown-properties-site
          REMOTE

      - name: Remote Cleanliness Check
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "bash '${REMOTE_SYNC_SCRIPT}' --check-clean '${DEPLOY_ROOT}' 'fortress-phronesis'"

      - name: Cleanup Remote Deploy Files
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "rm -rf '${DEPLOY_ROOT}' '${REMOTE_SYNC_SCRIPT}' '${REMOTE_ENV_FILE}'" || true

      - name: Public Smoke
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://lecrownproperties.com/ >/dev/null
          curl -fsSL "https://lecrownproperties.com/contact?lang=zh" >/dev/null
          curl -fsSL https://lecrownproperties.com/data/site.en.json >/dev/null
          curl -fsSL https://www.lecrownproperties.com/ >/dev/null

      - name: Deployment Summary
        shell: bash
        run: |
          {
            echo "## LeCrown Properties Deploy"
            echo ""
            echo "- Environment: \`${{ inputs.environment }}\`"
            echo "- Source SHA: \`${{ inputs.source_sha }}\`"
            echo "- Image: \`${IMAGE_REF}\`"
            echo "- Deploy credential source: \`${{ steps.resolve_deploy.outputs.credential_source }}\`"
            echo "- Public URL: https://lecrownproperties.com/"
          } >> "$GITHUB_STEP_SUMMARY"
