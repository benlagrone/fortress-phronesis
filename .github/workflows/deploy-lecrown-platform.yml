name: Deploy LeCrown Platform

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Commit SHA built by LeCrown Platform CI
        required: true
        type: string
      environment:
        description: Target environment
        required: true
        default: prod
        type: choice
        options:
          - prod
      run_public_smoke:
        description: Run split-host smoke checks after DNS, Nginx, and TLS cutover
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: lecrown-platform-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  secure-rental-finder-public:
    if: ${{ inputs.source_sha == 'secure-rental-finder-public' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout Fortress Repo
        uses: actions/checkout@v4

      - name: Prepare SSH
        shell: bash
        env:
          LECROWN_KEY: ${{ secrets.LECROWNPLATFORM_DEPLOY_SSH_KEY }}
          FORTRESS_KEY: ${{ secrets.FORTRESS_PERSONAL_DEPLOY_SSH_KEY }}
          SHARED_KEY: ${{ secrets.SOLOMONIC_CLOCK_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          DEPLOY_KEY="${LECROWN_KEY:-${FORTRESS_KEY:-${SHARED_KEY:-}}}"
          test -n "${DEPLOY_KEY}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "${DEPLOY_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Publish secured Rental Finder edge
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.LECROWNPLATFORM_DEPLOY_HOST != '' && secrets.LECROWNPLATFORM_DEPLOY_HOST || secrets.FORTRESS_PERSONAL_DEPLOY_HOST != '' && secrets.FORTRESS_PERSONAL_DEPLOY_HOST || secrets.SOLOMONIC_CLOCK_DEPLOY_HOST != '' && secrets.SOLOMONIC_CLOCK_DEPLOY_HOST || '89.117.151.145' }}
          DEPLOY_USER: ${{ secrets.LECROWNPLATFORM_DEPLOY_USER != '' && secrets.LECROWNPLATFORM_DEPLOY_USER || secrets.FORTRESS_PERSONAL_DEPLOY_USER != '' && secrets.FORTRESS_PERSONAL_DEPLOY_USER || secrets.SOLOMONIC_CLOCK_DEPLOY_USER != '' && secrets.SOLOMONIC_CLOCK_DEPLOY_USER || 'root' }}
        run: |
          set -euo pipefail
          SSH_OPTS=(-i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null)
          tar -C deploy/rental-finder-public -czf /tmp/rental-finder-public.tgz .
          scp "${SSH_OPTS[@]}" /tmp/rental-finder-public.tgz "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/rental-finder-public.tgz"
          ssh "${SSH_OPTS[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          static_root=/var/www/rental-finder
          release_root="/var/www/rental-finder-releases/$(date -u +%Y%m%d%H%M%S)"
          install -d -m 0755 "${release_root}"
          tar -xzf /tmp/rental-finder-public.tgz -C "${release_root}"
          rm -f /tmp/rental-finder-public.tgz
          test -s "${release_root}/index.html"
          ln -sfn "${release_root}" "${static_root}"

          nginx_config=/etc/nginx/sites-available/rentalfinder.lecrownproperties.com
          nginx_enabled=/etc/nginx/sites-enabled/rentalfinder.lecrownproperties.com
          nginx_backup="${nginx_config}.bak.$(date -u +%Y%m%d%H%M%S)"
          cp "${nginx_config}" "${nginx_backup}"
          restore_nginx() {
            cp "${nginx_backup}" "${nginx_config}"
            if ! test "${nginx_config}" -ef "${nginx_enabled}"; then cp "${nginx_config}" "${nginx_enabled}"; fi
            nginx -t && systemctl reload nginx
          }
          trap restore_nginx ERR
          install -m 0644 /dev/stdin "${nginx_config}" <<'NGINX_CONFIG'
          server {
              listen 80;
              server_name rentalfinder.lecrownproperties.com;
              location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; default_type "text/plain"; }
              location / { return 301 https://$host$request_uri; }
          }

          server {
              listen 443 ssl http2;
              server_name rentalfinder.lecrownproperties.com;
              ssl_certificate /etc/letsencrypt/live/rentalfinder.lecrownproperties.com/fullchain.pem;
              ssl_certificate_key /etc/letsencrypt/live/rentalfinder.lecrownproperties.com/privkey.pem;

              add_header Cache-Control "no-store" always;
              add_header Referrer-Policy "same-origin" always;
              add_header X-Content-Type-Options "nosniff" always;
              add_header X-Frame-Options "DENY" always;

              location = / { return 302 /rental-finder/; }

              location = /_rental_finder_auth {
                  internal;
                  proxy_pass http://127.0.0.1:18035/auth/me;
                  proxy_pass_request_body off;
                  proxy_set_header Content-Length "";
                  proxy_set_header Authorization $http_authorization;
                  proxy_set_header Host backoffice.lecrownproperties.com;
              }

              location = /rental-finder/api/auth/config {
                  proxy_pass http://127.0.0.1:18035/auth/config;
                  proxy_set_header Host backoffice.lecrownproperties.com;
              }

              location = /rental-finder/api/auth/google {
                  proxy_pass http://127.0.0.1:18035/auth/google;
                  proxy_set_header Host backoffice.lecrownproperties.com;
              }

              location = /rental-finder/api/auth/me {
                  proxy_pass http://127.0.0.1:18035/auth/me;
                  proxy_set_header Authorization $http_authorization;
                  proxy_set_header Host backoffice.lecrownproperties.com;
              }

              location = /rental-finder/api/auth/logout { return 204; }

              location /rental-finder/api/ {
                  if ($http_authorization = "") { return 401; }
                  auth_request /_rental_finder_auth;
                  proxy_pass http://192.168.0.36:8134;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto https;
                  proxy_connect_timeout 10s;
                  proxy_read_timeout 300s;
                  proxy_send_timeout 300s;
              }

              location /rental-finder/ {
                  root /var/www;
                  try_files $uri $uri/ /rental-finder/index.html;
              }
          }
          NGINX_CONFIG
          if ! test "${nginx_config}" -ef "${nginx_enabled}"; then cp "${nginx_config}" "${nginx_enabled}"; fi
          nginx -t
          systemctl reload nginx
          auth_config_status="$(curl -sS -o /tmp/rental-auth-config.json -w '%{http_code}' http://127.0.0.1:18035/auth/config)"
          app_status="$(curl -ksS -o /dev/null -w '%{http_code}' --resolve rentalfinder.lecrownproperties.com:443:127.0.0.1 https://rentalfinder.lecrownproperties.com/rental-finder/)"
          anonymous_status="000"
          for attempt in $(seq 1 15); do
            anonymous_status="$(curl -ksS -o /dev/null -w '%{http_code}' -X POST --resolve rentalfinder.lecrownproperties.com:443:127.0.0.1 https://rentalfinder.lecrownproperties.com/rental-finder/api/listings/search)"
            if test "${anonymous_status}" = "401"; then break; fi
            sleep 1
          done
          echo "auth_config_http=${auth_config_status} app_http=${app_status} anonymous_api_http=${anonymous_status}"
          test "${auth_config_status}" = "200"
          grep -q 'lecrownproperties.com' /tmp/rental-auth-config.json
          rm -f /tmp/rental-auth-config.json
          test "${app_status}" = "200"
          test "${anonymous_status}" = "401"
          trap - ERR
          find /var/www/rental-finder-releases -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' | sort -nr | tail -n +4 | cut -d' ' -f2- | xargs -r rm -rf
          REMOTE

  repair-rental-finder-public:
    if: ${{ inputs.source_sha == 'repair-rental-finder-public' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Prepare SSH
        shell: bash
        env:
          LECROWN_KEY: ${{ secrets.LECROWNPLATFORM_DEPLOY_SSH_KEY }}
          FORTRESS_KEY: ${{ secrets.FORTRESS_PERSONAL_DEPLOY_SSH_KEY }}
          SHARED_KEY: ${{ secrets.SOLOMONIC_CLOCK_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          DEPLOY_KEY="${LECROWN_KEY:-${FORTRESS_KEY:-${SHARED_KEY:-}}}"
          test -n "${DEPLOY_KEY}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "${DEPLOY_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Repair Rental Finder route
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.LECROWNPLATFORM_DEPLOY_HOST != '' && secrets.LECROWNPLATFORM_DEPLOY_HOST || secrets.FORTRESS_PERSONAL_DEPLOY_HOST != '' && secrets.FORTRESS_PERSONAL_DEPLOY_HOST || secrets.SOLOMONIC_CLOCK_DEPLOY_HOST != '' && secrets.SOLOMONIC_CLOCK_DEPLOY_HOST || '89.117.151.145' }}
          DEPLOY_USER: ${{ secrets.LECROWNPLATFORM_DEPLOY_USER != '' && secrets.LECROWNPLATFORM_DEPLOY_USER || secrets.FORTRESS_PERSONAL_DEPLOY_USER != '' && secrets.FORTRESS_PERSONAL_DEPLOY_USER || secrets.SOLOMONIC_CLOCK_DEPLOY_USER != '' && secrets.SOLOMONIC_CLOCK_DEPLOY_USER || 'root' }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          hostname
          ip -br addr show ipsec0 || true
          ip route replace 192.168.0.36/32 dev ipsec0 src 10.88.0.1
          iptables -t nat -C POSTROUTING -d 192.168.0.36/32 -o ipsec0 -j SNAT --to-source 10.88.0.1 2>/dev/null || \
            iptables -t nat -A POSTROUTING -d 192.168.0.36/32 -o ipsec0 -j SNAT --to-source 10.88.0.1
          install -m 0755 /dev/stdin /usr/local/sbin/rental-finder-sextant-route <<'ROUTE_SCRIPT'
          #!/bin/sh
          set -eu
          ip route replace 192.168.0.36/32 dev ipsec0 src 10.88.0.1
          iptables -t nat -C POSTROUTING -d 192.168.0.36/32 -o ipsec0 -j SNAT --to-source 10.88.0.1 2>/dev/null || \
            iptables -t nat -A POSTROUTING -d 192.168.0.36/32 -o ipsec0 -j SNAT --to-source 10.88.0.1
          ROUTE_SCRIPT
          install -m 0644 /dev/stdin /etc/systemd/system/rental-finder-sextant-route.service <<'ROUTE_UNIT'
          [Unit]
          Description=Route Rental Finder traffic to Fortress Sextant over IPsec
          Requires=fortress-unifi-xfrm.service
          After=fortress-unifi-xfrm.service

          [Service]
          Type=oneshot
          ExecStart=/usr/local/sbin/rental-finder-sextant-route
          RemainAfterExit=yes

          [Install]
          WantedBy=multi-user.target
          ROUTE_UNIT
          systemctl daemon-reload
          systemctl enable --now rental-finder-sextant-route.service
          ip route get 192.168.0.36
          curl -fsS -o /dev/null -w 'sextant_http=%{http_code} time=%{time_total}\n' --connect-timeout 5 --max-time 10 http://192.168.0.36:8134/rental-finder/

          nginx_config=/etc/nginx/sites-available/rentalfinder.lecrownproperties.com
          nginx_enabled=/etc/nginx/sites-enabled/rentalfinder.lecrownproperties.com
          nginx_backup="${nginx_config}.bak.$(date -u +%Y%m%d%H%M%S)"
          find /etc/nginx/sites-enabled -maxdepth 1 -type f -name 'rentalfinder.lecrownproperties.com.bak.20260905*' -delete
          cp "${nginx_config}" "${nginx_backup}"
          restore_nginx() {
            cp "${nginx_backup}" "${nginx_config}"
            if ! test "${nginx_config}" -ef "${nginx_enabled}"; then
              cp "${nginx_config}" "${nginx_enabled}"
            fi
            nginx -t
            systemctl reload nginx
          }
          trap restore_nginx ERR
          install -m 0644 /dev/stdin "${nginx_config}" <<'NGINX_CONFIG'
          server {
              listen 80;
              server_name rentalfinder.lecrownproperties.com;

              location ^~ /.well-known/acme-challenge/ {
                  root /var/www/letsencrypt;
                  default_type "text/plain";
              }

              location / {
                  return 301 https://$host$request_uri;
              }
          }

          server {
              listen 443 ssl http2;
              server_name rentalfinder.lecrownproperties.com;

              ssl_certificate /etc/letsencrypt/live/rentalfinder.lecrownproperties.com/fullchain.pem;
              ssl_certificate_key /etc/letsencrypt/live/rentalfinder.lecrownproperties.com/privkey.pem;

              add_header Cache-Control "no-store" always;
              add_header Referrer-Policy "same-origin" always;
              add_header X-Content-Type-Options "nosniff" always;
              add_header X-Frame-Options "DENY" always;

              location = / {
                  return 302 /rental-finder/;
              }

              location /rental-finder/ {
                  proxy_pass http://192.168.0.36:8134;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto https;
                  proxy_connect_timeout 10s;
                  proxy_read_timeout 300s;
                  proxy_send_timeout 300s;
              }
          }
          NGINX_CONFIG
          if ! test "${nginx_config}" -ef "${nginx_enabled}"; then
            cp "${nginx_config}" "${nginx_enabled}"
          fi
          nginx -t
          systemctl reload nginx
          for attempt in $(seq 1 15); do
            if curl -kfsS -o /dev/null --resolve rentalfinder.lecrownproperties.com:443:127.0.0.1 https://rentalfinder.lecrownproperties.com/rental-finder/; then
              break
            fi
            sleep 1
          done
          curl -kfsS -o /dev/null -w 'edge_http=%{http_code}\n' --resolve rentalfinder.lecrownproperties.com:443:127.0.0.1 https://rentalfinder.lecrownproperties.com/rental-finder/
          trap - ERR
          REMOTE

  deploy:
    if: ${{ inputs.source_sha != 'repair-rental-finder-public' && inputs.source_sha != 'secure-rental-finder-public' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      COMPOSE_PROJECT: lecrown-platform
      API_IMAGE_REF: ghcr.io/benlagrone/lecrown-properties-platform-api:sha-${{ inputs.source_sha }}
      ADMIN_IMAGE_REF: ghcr.io/benlagrone/lecrown-properties-platform-admin:sha-${{ inputs.source_sha }}
    steps:
      - name: Checkout Fortress Repo
        uses: actions/checkout@v4

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.LECROWNPLATFORM_DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.LECROWNPLATFORM_DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy On Server
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.LECROWNPLATFORM_DEPLOY_HOST != '' && secrets.LECROWNPLATFORM_DEPLOY_HOST || '89.117.151.145' }}
          DEPLOY_USER: ${{ secrets.LECROWNPLATFORM_DEPLOY_USER != '' && secrets.LECROWNPLATFORM_DEPLOY_USER || 'root' }}
          DEPLOY_ROOT: ${{ secrets.LECROWNPLATFORM_DEPLOY_ROOT != '' && secrets.LECROWNPLATFORM_DEPLOY_ROOT || '/root/workspace/fortress-phronesis' }}
          GHCR_READ_TOKEN: ${{ secrets.LECROWNPLATFORM_GHCR_READ_TOKEN }}
        run: |
          set -euo pipefail
          REMOTE_SYNC_SCRIPT="/tmp/lecrown-platform-sync-prod-repo-${GITHUB_RUN_ID}.sh"
          SSH_OPTS=(-i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null)

          scp "${SSH_OPTS[@]}" scripts/sync-prod-repo.sh "${DEPLOY_USER}@${DEPLOY_HOST}:${REMOTE_SYNC_SCRIPT}"

          ssh "${SSH_OPTS[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "LECROWNPLATFORM_API_IMAGE='${API_IMAGE_REF}' LECROWNPLATFORM_ADMIN_IMAGE='${ADMIN_IMAGE_REF}' DEPLOY_ROOT='${DEPLOY_ROOT}' GHCR_READ_TOKEN='${GHCR_READ_TOKEN}' COMPOSE_PROJECT='${COMPOSE_PROJECT}' SYNC_SCRIPT='${REMOTE_SYNC_SCRIPT}' bash -s" <<'REMOTE'
          set -euo pipefail

          chmod 700 "${SYNC_SCRIPT}"
          trap 'rm -f "${SYNC_SCRIPT}"' EXIT

          bash "${SYNC_SCRIPT}" "${DEPLOY_ROOT}" "https://github.com/benlagrone/fortress-phronesis.git" main "fortress-phronesis"

          if [ -n "${GHCR_READ_TOKEN:-}" ]; then
            echo "${GHCR_READ_TOKEN}" | docker login ghcr.io -u benlagrone --password-stdin
          fi

          cd "${DEPLOY_ROOT}"

          COMPOSE_CMD=(docker compose -p "${COMPOSE_PROJECT}" -f docker-compose.lecrown-platform.yml)
          if [ -f .env.lecrown-platform.local ]; then
            COMPOSE_CMD=(docker compose --env-file .env.lecrown-platform.local -p "${COMPOSE_PROJECT}" -f docker-compose.lecrown-platform.yml)
          fi

          LECROWNPLATFORM_API_IMAGE="${LECROWNPLATFORM_API_IMAGE}" \
          LECROWNPLATFORM_ADMIN_IMAGE="${LECROWNPLATFORM_ADMIN_IMAGE}" \
          "${COMPOSE_CMD[@]}" pull lecrown-platform-api lecrown-platform-admin

          LECROWNPLATFORM_API_IMAGE="${LECROWNPLATFORM_API_IMAGE}" \
          LECROWNPLATFORM_ADMIN_IMAGE="${LECROWNPLATFORM_ADMIN_IMAGE}" \
          "${COMPOSE_CMD[@]}" up -d lecrown-platform-api lecrown-platform-admin

          "${COMPOSE_CMD[@]}" ps lecrown-platform-api lecrown-platform-admin

          for url in \
            http://127.0.0.1:18035/healthz \
            http://127.0.0.1:13082/; do
            for attempt in $(seq 1 20); do
              if curl -fsS "$url" >/dev/null 2>&1; then
                break
              fi
              sleep 2
            done
            curl -fsS "$url" >/dev/null
          done

          bash "${SYNC_SCRIPT}" --check-clean "${DEPLOY_ROOT}" "fortress-phronesis"
          REMOTE

      - name: Public Smoke
        if: ${{ inputs.run_public_smoke }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS https://api.lecrowndevelopment.com/healthz >/dev/null
          curl -fsSIL https://app.lecrowndevelopment.com/ >/dev/null

      - name: Deployment Summary
        shell: bash
        run: |
          {
            echo "## LeCrown Platform Deploy"
            echo ""
            echo "- Environment: \`${{ inputs.environment }}\`"
            echo "- Source SHA: \`${{ inputs.source_sha }}\`"
            echo "- Public smoke: \`${{ inputs.run_public_smoke }}\`"
            echo "- API image: \`${API_IMAGE_REF}\`"
            echo "- Admin image: \`${ADMIN_IMAGE_REF}\`"
            echo "- App URL: https://app.lecrowndevelopment.com/"
            echo "- API URL: https://api.lecrowndevelopment.com/healthz"
          } >> "$GITHUB_STEP_SUMMARY"
