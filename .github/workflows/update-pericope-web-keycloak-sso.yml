name: Update Pericope Web Keycloak SSO

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-pericope-web-keycloak-sso.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keycloak-pericope-web-sso
  cancel-in-progress: false

jobs:
  update-client:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout Fortress Repo
        uses: actions/checkout@v4

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.SOLOMONIC_CLOCK_DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.SOLOMONIC_CLOCK_DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Update Keycloak Client On Server
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.SOLOMONIC_CLOCK_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.SOLOMONIC_CLOCK_DEPLOY_USER }}
        run: |
          set -euo pipefail

          ssh -i ~/.ssh/id_ed25519 "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail

          KC_CONTAINER="${KC_CONTAINER:-auth-keycloak-1}"
          if ! docker ps --format '{{.Names}}' | grep -qx "${KC_CONTAINER}"; then
            KC_CONTAINER="$(docker ps --format '{{.Names}}' | awk '/keycloak/ {print; exit}')"
          fi

          if [ -z "${KC_CONTAINER:-}" ]; then
            echo "No running Keycloak container found." >&2
            exit 1
          fi

          KC_ENV_JSON="$(docker inspect "${KC_CONTAINER}" --format '{{json .Config.Env}}')"
          KC_ADMIN_USER="$(
            printf '%s' "${KC_ENV_JSON}" | python3 -c 'import json,sys; data=json.load(sys.stdin); env=dict(item.split("=",1) for item in data if "=" in item); print(env.get("KC_BOOTSTRAP_ADMIN_USERNAME") or env.get("KEYCLOAK_ADMIN") or "")'
          )"
          KC_ADMIN_PASSWORD="$(
            printf '%s' "${KC_ENV_JSON}" | python3 -c 'import json,sys; data=json.load(sys.stdin); env=dict(item.split("=",1) for item in data if "=" in item); print(env.get("KC_BOOTSTRAP_ADMIN_PASSWORD") or env.get("KEYCLOAK_ADMIN_PASSWORD") or "")'
          )"

          if [ -z "${KC_ADMIN_USER}" ] || [ -z "${KC_ADMIN_PASSWORD}" ]; then
            echo "Could not determine Keycloak admin credentials from container env." >&2
            exit 1
          fi

          docker exec "${KC_CONTAINER}" /opt/keycloak/bin/kcadm.sh config credentials \
            --server http://127.0.0.1:8080 \
            --realm master \
            --user "${KC_ADMIN_USER}" \
            --password "${KC_ADMIN_PASSWORD}"

          KC_CLIENT_ID="$(
            docker exec "${KC_CONTAINER}" /opt/keycloak/bin/kcadm.sh get clients -r pericope --fields id,clientId \
              | python3 -c 'import json,sys; clients=json.load(sys.stdin); print(next((client.get("id","") for client in clients if client.get("clientId") == "pericope-web"), ""))'
          )"

          if [ -z "${KC_CLIENT_ID}" ]; then
            echo "Could not resolve Keycloak client id for pericope-web." >&2
            exit 1
          fi

          KC_CLIENT_JSON="$(docker exec "${KC_CONTAINER}" /opt/keycloak/bin/kcadm.sh get "clients/${KC_CLIENT_ID}" -r pericope)"

          REDIRECTS_JSON="$(
            printf '%s' "${KC_CLIENT_JSON}" | python3 -c 'import json,sys; client=json.load(sys.stdin); values=set(client.get("redirectUris") or []); values.update({"https://pericopeai.com/*","https://truevineos.cloud/*","http://localhost:13080/*","http://localhost:8086/*","http://127.0.0.1:8086/*"}); print(json.dumps(sorted(values), separators=(",", ":")))'
          )"

          ORIGINS_JSON="$(
            printf '%s' "${KC_CLIENT_JSON}" | python3 -c 'import json,sys; client=json.load(sys.stdin); values=set(client.get("webOrigins") or []); values.update({"https://pericopeai.com","https://truevineos.cloud","http://localhost:13080","http://localhost:8086","http://127.0.0.1:8086"}); print(json.dumps(sorted(values), separators=(",", ":")))'
          )"

          docker exec "${KC_CONTAINER}" /opt/keycloak/bin/kcadm.sh update "clients/${KC_CLIENT_ID}" -r pericope \
            -s "redirectUris=${REDIRECTS_JSON}" \
            -s "webOrigins=${ORIGINS_JSON}"

          docker exec "${KC_CONTAINER}" /opt/keycloak/bin/kcadm.sh get "clients/${KC_CLIENT_ID}" -r pericope \
            | python3 -c 'import json,sys; client=json.load(sys.stdin); redirects=set(client.get("redirectUris") or []); origins=set(client.get("webOrigins") or []); required_redirects={"https://truevineos.cloud/*","http://localhost:8086/*","http://127.0.0.1:8086/*"}; required_origins={"https://truevineos.cloud","http://localhost:8086","http://127.0.0.1:8086"}; missing_redirects=sorted(required_redirects - redirects); missing_origins=sorted(required_origins - origins); 0 if not (missing_redirects or missing_origins) else (_ for _ in ()).throw(SystemExit("Missing Keycloak client settings. Redirects: %s Origins: %s" % (missing_redirects, missing_origins))); print("Updated pericope-web redirect URIs and web origins.")'
          REMOTE

      - name: Public Redirect Smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import hashlib
          import urllib.parse
          import urllib.request

          verifier = "a" * 64
          challenge = base64.urlsafe_b64encode(hashlib.sha256(verifier.encode()).digest()).decode().rstrip("=")
          params = {
              "client_id": "pericope-web",
              "response_type": "code",
              "scope": "openid",
              "code_challenge": challenge,
              "code_challenge_method": "S256",
          }
          for redirect_uri in (
              "https://truevineos.cloud/clock",
              "http://localhost:8086/clock",
              "http://127.0.0.1:8086/clock",
          ):
              query = urllib.parse.urlencode({**params, "redirect_uri": redirect_uri})
              url = f"https://auth.pericopeai.com/realms/pericope/protocol/openid-connect/auth?{query}"
              with urllib.request.urlopen(url) as response:
                  body = response.read().decode("utf-8", errors="replace")
              if "Invalid parameter: redirect_uri" in body:
                  raise SystemExit(f"Redirect URI still rejected: {redirect_uri}")
              if "Sign in to pericope" not in body:
                  raise SystemExit(f"Unexpected Keycloak response for redirect URI: {redirect_uri}")
              print(f"Accepted redirect URI: {redirect_uri}")
          PY

      - name: Deployment Summary
        shell: bash
        run: |
          {
            echo "## Keycloak SSO Update"
            echo ""
            echo "- Updated client: \`pericope-web\`"
            echo "- Added redirect URI coverage for \`https://truevineos.cloud/*\`"
            echo "- Added web origin coverage for \`https://truevineos.cloud\`"
            echo "- Added local clock dev coverage for \`http://localhost:8086\` and \`http://127.0.0.1:8086\`"
          } >> "$GITHUB_STEP_SUMMARY"
